501.learn2": ["why we round and what the sign ≈ means.", "how to round to the nearest 10.", "how to round to the nearest 100.", "how to round to the nearest 1,000 and what happens at halfway.", "how to round a decimal to a whole number.", "how rounding gives a quick estimate."]};

var SLIDE_MORE = {"1.learn1": [{"more": ["Our number system uses only ten digits, 0 to 9. What makes it powerful is that where a digit sits changes how much it is worth. In 4,372 the 3 is in the tens column, so it is worth 3 tens, which is 30, not 3.", "To find the value of a digit, name its column first and then multiply. A digit's value is the digit times the value of its column. This works for any whole number, however big."], "eg": ["Example 1: In 6,805 the 8 is in the hundreds column, so its value is 8 × 100 = 800.", "Example 2: In 52,417 the 5 is in the ten thousands column, so its value is 5 × 10,000 = 50,000.", "Example 3: In 3,333 every digit is a 3, but the values are 3,000, 300, 30 and 3. Same digit, four different values."], "vid": {"t": "Corbettmaths: place value (free video)", "u": "https://corbettmaths.com/2013/03/29/place-value/"}}, {"more": ["Moving one column to the left makes a digit worth 10 times more. Moving one column to the right makes it worth 10 times less. That is the whole secret of place value.", "The same rule carries on past the decimal point: tenths, hundredths, thousandths. Each column to the right is ten times smaller than the one before."], "eg": ["Example 1: 4 ones is 4. 4 tens is 40. 4 hundreds is 400. Each step is × 10.", "Example 2: 0.7 is seven tenths. 0.07 is seven hundredths, which is 10 times smaller.", "Example 3: £5 is 500p, which is 100 times more than 5p. Money follows the same pattern."], "vid": {"t": "Corbettmaths: place value (free video)", "u": "https://corbettmaths.com/2013/03/29/place-value/"}}, {"more": ["Zero is the placeholder. It says: there is nothing in this column, but keep the column so the other digits stay in the right places.", "If you left a zero out, every digit to its left would slide into the wrong column and the number would change size. 305 and 35 are very different numbers."], "eg": ["Example 1: 4,050 has no hundreds and no ones. Written out: 4 thousands, 0 hundreds, 5 tens, 0 ones.", "Example 2: 700,007 is seven hundred thousand and seven. The four zeros hold the middle columns.", "Example 3: 2.05 has no tenths. Without the zero it would be 2.5, which is much bigger."], "vid": {"t": "Corbettmaths: place value (free video)", "u": "https://corbettmaths.com/2013/03/29/place-value/"}}, {"more": ["To compare numbers, line them up by place value and compare from the left, because the leftmost column is worth the most. The first column where the digits differ decides which number is bigger.", "With decimals, do not count the digits. 0.5 is bigger than 0.45 even though 45 is bigger than 5. Write 0.5 as 0.50 so both have two decimal places, then compare 50 hundredths with 45 hundredths."], "eg": ["Example 1: Compare 3.6 and 3.59. Write 3.60 and 3.59. Tenths: 6 is bigger than 5, so 3.6 is bigger.", "Example 2: Order 0.8, 0.08, 0.78 from smallest. Write them as 0.80, 0.08, 0.78. Order: 0.08, 0.78, 0.8.", "Example 3: Compare 40,512 and 40,521. Same until the tens: 1 is smaller than 2, so 40,512 is smaller."], "vid": {"t": "Corbettmaths: ordering decimals (free video)", "u": "https://corbettmaths.com/2012/08/10/ordering-decimals-video/"}}, {"more": ["Big numbers are easier to read in groups of three digits, counting from the right. Each group has a name: ones, thousands, millions. We say the group, then its name.", "Say the number in chunks: the millions chunk, the word million, the thousands chunk, the word thousand, then the rest. Zeros that fill a whole group are not spoken."], "eg": ["Example 1: 3,208,450 is three million, two hundred and eight thousand, four hundred and fifty.", "Example 2: 70,030 is seventy thousand and thirty.", "Example 3: Write one million, forty thousand and six in digits: 1,040,006."], "vid": {"t": "Corbettmaths: place value (free video)", "u": "https://corbettmaths.com/2013/03/29/place-value/"}}], "1.learn2": [{"more": ["Rounding gives us a number that is close to the real one but easier to use. We round when an exact answer is not needed, or when it would be silly to give one.", "Rounding is about finding the nearest 'friendly' number, such as the nearest 10, 100 or 1,000. The friendly numbers are the landmarks on a number line, and we pick the landmark we are closest to."], "eg": ["Example 1: A football crowd of 38,642 is reported as about 39,000.", "Example 2: A bag of crisps weighs 33 g. Rounded to the nearest 10 g it is 30 g.", "Example 3: A car costs £11,980. Roughly it is £12,000."], "vid": {"t": "BBC: Bitesize numbers and rounding guides", "u": "https://www.bbc.co.uk/bitesize/subjects/znwqtfr"}}, {"more": ["Here is a method that works every time. Step 1: underline the digit in the place you are rounding to. Step 2: look at the digit just to its right. Step 3: if it is 5 or more, round up; if it is 4 or less, leave it. Step 4: replace everything to the right with zeros (or drop it after the decimal point).", "The digit you underline is the only one that might change. The digit next door is the decider."], "eg": ["Example 1: Round 4,682 to the nearest 100. Underline 6. Next digit is 8, so go up: 4,700.", "Example 2: Round 4,632 to the nearest 100. Next digit is 3, so stay: 4,600.", "Example 3: Round 85 to the nearest 10. Underline 8, next digit 5, go up: 90."], "vid": {"t": "BBC: Bitesize numbers and rounding guides", "u": "https://www.bbc.co.uk/bitesize/subjects/znwqtfr"}}, {"more": ["Why does 5 go up? Because 5 is exactly halfway, and by agreement halfway rounds up. Anything below halfway is closer to the lower number.", "A number line helps. Between 2,300 and 2,400 the halfway point is 2,350. A number at or above 2,350 is nearer 2,400."], "eg": ["Example 1: 2,350 to the nearest 100 is 2,400, because it is exactly halfway and halfway goes up.", "Example 2: 2,349 to the nearest 100 is 2,300, because it is just below halfway.", "Example 3: 65 to the nearest 10 is 70, and 64 to the nearest 10 is 60."], "vid": {"t": "BBC: Bitesize numbers and rounding guides", "u": "https://www.bbc.co.uk/bitesize/subjects/znwqtfr"}}, {"more": ["Let us work this example slowly. Use the four steps and say each one aloud as you go. Check the final answer sits between the two landmarks and is the nearer one.", "After rounding, ask: is my answer a multiple of the place I rounded to? A number rounded to the nearest 100 must end in 00."], "eg": ["Try it: round 7,461 to the nearest 10. Underline 6, next digit 1, stay: 7,460.", "Try it: round 19,950 to the nearest 1,000. Underline 9, next digit 9, go up: 20,000.", "Try it: round 3,096 to the nearest 100. Underline 0, next digit 9, go up: 3,100."], "vid": {"t": "BBC: Bitesize numbers and rounding guides", "u": "https://www.bbc.co.uk/bitesize/subjects/znwqtfr"}}, {"more": ["The tricky case is a 9. If the digit you underline is 9 and it has to go up, it becomes 10, so you write 0 and carry 1 into the next column on the left.", "This is just like carrying in addition. The thousands, hundreds and tens all follow on."], "eg": ["Example 1: Round 4,968 to the nearest 100. Underline 9, next digit 6, go up. 9 becomes 10, carry 1: 5,000.", "Example 2: Round 799 to the nearest 10. Underline 9, next digit 9, go up: 800.", "Example 3: Round 9,996 to the nearest 10: 10,000."], "vid": {"t": "BBC: Bitesize numbers and rounding guides", "u": "https://www.bbc.co.uk/bitesize/subjects/znwqtfr"}}, {"more": ["Rounding works the same with decimals. To round to the nearest whole number, underline the ones digit and look at the tenths. To round to one decimal place, underline the tenths digit and look at the hundredths.", "When you round a decimal, drop the digits after the place you rounded to. Do not leave zeros there."], "eg": ["Example 1: 6.38 to the nearest whole number: tenths digit 3, stay: 6.", "Example 2: 6.38 to one decimal place: hundredths digit 8, go up: 6.4.", "Example 3: £4.76 to the nearest pound: £5."], "vid": {"t": "BBC: Bitesize numbers and rounding guides", "u": "https://www.bbc.co.uk/bitesize/subjects/znwqtfr"}}, {"more": ["Estimating means rounding first and then calculating. It lets you check that an answer is sensible, and it lets you decide quickly in real life, for example in a shop.", "Round each number to something you can easily work with, usually one significant digit. Your estimate will not be exact, but it should be close."], "eg": ["Example 1: 398 + 206 is about 400 + 200 = 600. The exact answer 604 is close, so it is sensible.", "Example 2: 4.9 × 6.1 is about 5 × 6 = 30.", "Example 3: £2.95 × 4 is about £3 × 4 = £12, so £20 would definitely be enough."], "vid": {"t": "BBC: Bitesize numbers and rounding guides", "u": "https://www.bbc.co.uk/bitesize/subjects/znwqtfr"}}], "2.learn1": [{"more": ["Column addition means writing numbers so that ones sit under ones, tens under tens, and so on. Then add column by column starting at the right. If a column adds to 10 or more, write the ones digit and carry the tens digit to the next column.", "The carried digit is small, so write it neatly above the next column. Do not forget to add it in."], "eg": ["Example 1: 3,478 + 2,645. Ones 8+5=13, write 3 carry 1. Tens 7+4+1=12, write 2 carry 1. Hundreds 4+6+1=11, write 1 carry 1. Thousands 3+2+1=6. Answer 6,123.", "Example 2: 5,906 + 487. Ones 6+7=13, write 3 carry 1. Tens 0+8+1=9. Hundreds 9+4=13, write 3 carry 1. Thousands 5+1=6. Answer 6,393.", "Example 3: £12.50 + £8.75 = £21.25, lining up the decimal points."], "vid": {"t": "Corbettmaths: column addition (free video)", "u": "https://corbettmaths.com/2013/12/19/addition-video-6/"}}, {"more": ["In column subtraction you take the bottom number from the top, column by column from the right. If the top digit is smaller than the bottom digit, exchange: take 1 from the next column to the left and add it as 10 to this column.", "Exchanging does not change the number, it only rewrites it. 52 is 5 tens and 2 ones, and it is also 4 tens and 12 ones."], "eg": ["Example 1: 82 − 47. 2 is less than 7, so exchange: 12 − 7 = 5. Tens: 7 − 4 = 3. Answer 35.", "Example 2: 600 − 238. Exchange from the hundreds across the zero tens: 5 hundreds, 9 tens, 10 ones. 10−8=2, 9−3=6, 5−2=3. Answer 362.", "Example 3: 3,004 − 1,876 = 1,128."], "vid": {"t": "Corbettmaths: subtracting decimals (free video)", "u": "https://corbettmaths.com/2013/03/28/subtracting-decimals/"}}, {"more": ["Mental strategies save time. Partitioning splits a number into parts. Compensating changes a number to a friendly one, then fixes the difference. Bridging through 10 or 100 breaks a jump into easy steps.", "Choose the strategy that makes the sum easiest. There is no single right way."], "eg": ["Example 1: 47 + 28. Add 30, take away 2: 77 − 2 = 75.", "Example 2: 304 − 99. Take away 100, then add 1: 205.", "Example 3: 8 × 15. Double 15 to 30, double to 60, double to 120. Answer 120."], "vid": {"t": "Corbettmaths: column addition (free video)", "u": "https://corbettmaths.com/2013/12/19/addition-video-6/"}}, {"more": ["Checking is a skill. The inverse operation undoes the sum: subtraction undoes addition, division undoes multiplication. If 3,478 + 2,645 = 6,123, then 6,123 − 2,645 should give 3,478.", "Also estimate: round first and see if the answer is close. Both checks take under a minute and catch most mistakes."], "eg": ["Example 1: 82 − 47 = 35. Check: 35 + 47 = 82. Correct.", "Example 2: 6 × 48 = 288. Check: 288 ÷ 6 = 48. Correct.", "Example 3: 497 + 302 is about 500 + 300 = 800. Answer 799 is sensible."], "vid": {"t": "Corbettmaths: column addition (free video)", "u": "https://corbettmaths.com/2013/12/19/addition-video-6/"}}], "2.learn2": [{"more": ["Multiplication is repeated equal groups. An array shows this as rows and columns. 4 rows of 6 is 4 × 6 = 24. Turn the array around and you get 6 rows of 4, still 24, so the order does not matter.", "Arrays are the first picture of area, which is why they lead naturally to the area method."], "eg": ["Example 1: 3 rows of 5 gives 15 dots.", "Example 2: A chocolate bar with 6 columns and 4 rows has 24 pieces.", "Example 3: An egg tray 2 by 6 holds 12 eggs."], "vid": {"t": "Corbettmaths: times tables (free video)", "u": "https://corbettmaths.com/2015/12/10/times-tables/"}}, {"more": ["The area method splits both numbers into tens and ones, draws a grid, multiplies each box, then adds the boxes. It turns one hard multiplication into several easy ones.", "Always partition carefully: 23 is 20 + 3, and 14 is 10 + 4. Four boxes, four easy products."], "eg": ["Example 1: 23 × 14. 20×10=200, 20×4=80, 3×10=30, 3×4=12. Total 200+80+30+12=322.", "Example 2: 35 × 12. 30×10=300, 30×2=60, 5×10=50, 5×2=10. Total 420.", "Example 3: 18 × 6. 10×6=60, 8×6=48. Total 108."], "vid": {"t": "Corbettmaths: grid method multiplication (free video)", "u": "https://corbettmaths.com/2013/12/20/multiplication-grid-method-video-199/"}}, {"more": ["Use the area method for real problems. First decide what you are multiplying, then partition, then add. Say the answer with its units.", "Estimating first protects you from slips: if your estimate is 400 and the answer is 4,000, something went wrong."], "eg": ["Example 1: 24 children each need 15 stickers. 24×15: 20×10=200, 20×5=100, 4×10=40, 4×5=20. Total 360 stickers.", "Example 2: 12 packs of 36 pencils: 36×12 = 360 + 72 = 432 pencils.", "Example 3: 16 tickets at £25: 16×25=£400."], "vid": {"t": "Corbettmaths: grid method multiplication (free video)", "u": "https://corbettmaths.com/2013/12/20/multiplication-grid-method-video-199/"}}, {"more": ["Division has two meanings. Sharing: 12 shared between 3 is 4 each. Grouping: how many groups of 3 fit into 12? Also 4. Both are division, and both are the inverse of multiplication.", "Knowing times tables lets you divide: if 7 × 8 = 56, then 56 ÷ 8 = 7."], "eg": ["Example 1: 20 sweets shared between 4 children is 5 each.", "Example 2: How many 5 m ropes can be cut from 35 m? 35 ÷ 5 = 7.", "Example 3: 72 ÷ 9 = 8 because 9 × 8 = 72."], "vid": {"t": "Corbettmaths: short division (free video)", "u": "https://corbettmaths.com/2013/12/28/division-video-98/"}}, {"more": ["Chunking breaks a big division into subtractions of easy multiples. Keep taking away friendly multiples of the divisor until nothing, or less than the divisor, is left. Add up the multiples you used.", "Write down the easy multiples first (×10, ×5, ×2). That makes each step simple."], "eg": ["Example 1: 156 ÷ 6. 6×20=120, left 36. 6×6=36. Answer 20+6=26.", "Example 2: 288 ÷ 12. 12×20=240, left 48. 12×4=48. Answer 24.", "Example 3: 450 ÷ 15. 15×30=450. Answer 30."], "vid": {"t": "Corbettmaths: long division (free video)", "u": "https://corbettmaths.com/2020/05/22/long-division-video/"}}, {"more": ["A remainder is what is left over. What you do with it depends on the question. Sometimes you round up (you need an extra bus), sometimes you round down (whole cakes only), sometimes you write the remainder, sometimes you share it as a fraction.", "Always reread the question before choosing."], "eg": ["Example 1: 29 people, cars hold 5. 29÷5 = 5 remainder 4. We need 6 cars, so round up.", "Example 2: 29 sweets between 5 children: 5 each, 4 left over, remainder 4.", "Example 3: £29 shared by 4: 29÷4 = 7 remainder 1, which is £7.25 each."], "vid": {"t": "Corbettmaths: division with remainders (free video)", "u": "https://corbettmaths.com/2012/08/11/1334/"}}, {"more": ["BIDMAS tells us the order to work in: Brackets, Indices, Division and Multiplication (left to right), Addition and Subtraction (left to right). Multiplication and division share a rank, and so do addition and subtraction.", "Without agreed order, one calculation could have two answers. The rule makes sure everybody gets the same one."], "eg": ["Example 1: 3 + 4 × 2. Multiply first: 3 + 8 = 11.", "Example 2: (3 + 4) × 2. Brackets first: 7 × 2 = 14.", "Example 3: 20 − 12 ÷ 4 = 20 − 3 = 17."], "vid": {"t": "Corbettmaths: order of operations (BODMAS) (free video)", "u": "https://corbettmaths.com/2013/06/08/order-of-operations/"}}, {"more": ["Order matters in real life. A shop sells 3 pens at £2 each and a £5 book. The cost is 3 × 2 + 5 = 11. Writing the sum in the right order gives the correct total.", "Brackets let you show what to do first when the plain order would give the wrong meaning."], "eg": ["Example 1: Pens at £2, three of them, plus a £5 book: 3 × 2 + 5 = £11.", "Example 2: Three friends each pay £2 plus a £5 entry: 3 × (2 + 5) = £21.", "Example 3: Same numbers, different brackets, different answers: 11 and 21."], "vid": {"t": "Corbettmaths: order of operations (BODMAS) (free video)", "u": "https://corbettmaths.com/2013/06/08/order-of-operations/"}}], "3.learn1": [{"more": ["A fraction names equal parts of a whole. The bottom number, the denominator, says how many equal parts the whole is cut into. The top number, the numerator, says how many of those parts we are talking about.", "The parts must be equal. A pizza cut into 8 unequal slices does not show eighths."], "eg": ["Example 1: 3 of 8 equal slices is 3/8.", "Example 2: 5/6 means the whole is cut into 6 equal parts and we have 5 of them.", "Example 3: 1/2 of 10 sweets means 5 sweets."], "vid": {"t": "Corbettmaths: fractions of shapes (free video)", "u": "https://corbettmaths.com/2013/02/15/fractions-shapes/"}}, {"more": ["Equivalent fractions are different names for the same amount. Multiply (or divide) the top and bottom by the same number and the size does not change, because you are multiplying by 1 in disguise.", "Fraction walls and number lines show this: the 1/2 mark is also the 2/4 mark and the 4/8 mark."], "eg": ["Example 1: 1/2 = 2/4 = 3/6 = 4/8.", "Example 2: 2/3 = 8/12 (multiply top and bottom by 4).", "Example 3: 6/9 = 2/3 (divide top and bottom by 3)."], "vid": {"t": "Corbettmaths: equivalent fractions (free video)", "u": "https://corbettmaths.com/2013/02/15/equivalent-fractions/"}}, {"more": ["Simplifying means writing a fraction with the smallest possible numbers. Divide the top and bottom by the same number. Keep going until the only number that divides both is 1.", "The quickest route is to find the highest common factor of both numbers and divide once."], "eg": ["Example 1: 12/18. Both divide by 6: 2/3.", "Example 2: 20/50. Both divide by 10: 2/5.", "Example 3: 15/45 = 1/3 after dividing by 15."], "vid": {"t": "Corbettmaths: simplifying fractions (free video)", "u": "https://corbettmaths.com/2013/03/03/simplifying-fractions-2/"}}, {"more": ["To compare fractions, give them the same denominator, then compare the numerators. If numerators are the same, the fraction with the smaller denominator is bigger, because its pieces are larger.", "To order several fractions, convert them all to the same denominator first."], "eg": ["Example 1: 3/4 and 2/3. Use twelfths: 9/12 and 8/12. So 3/4 is bigger.", "Example 2: 3/5 is bigger than 3/8, because fifths are bigger than eighths.", "Example 3: Order 1/2, 3/8, 5/8 from smallest: 3/8, 1/2, 5/8 (1/2 = 4/8)."], "vid": {"t": "Corbettmaths: ordering fractions (free video)", "u": "https://corbettmaths.com/2013/02/17/ordering-fractions/"}}, {"more": ["An improper fraction has a top number bigger than the bottom, such as 7/4. A mixed number has a whole part and a fraction, such as 1 3/4. They are two ways to write the same amount.", "To convert 7/4: how many whole 4s are in 7? One, with 3 left. So 1 3/4. To go back, multiply the whole by the denominator and add the numerator."], "eg": ["Example 1: 9/4 = 2 1/4.", "Example 2: 3 2/5 = (3×5+2)/5 = 17/5.", "Example 3: 11/3 = 3 2/3."], "vid": {"t": "Corbettmaths: improper fractions to mixed numbers (free video)", "u": "https://corbettmaths.com/2013/02/15/improper-fractions-to-mixed-numbers/"}}], "3.learn2": [{"more": ["To find a fraction of an amount, divide by the denominator, then multiply by the numerator. Divide to find one part, multiply to find the parts you want.", "Check by asking if your answer is less than the whole amount for a fraction below 1."], "eg": ["Example 1: 3/4 of 20. 20÷4=5, 5×3=15.", "Example 2: 2/5 of 35. 35÷5=7, 7×2=14.", "Example 3: 5/6 of 48. 48÷6=8, 8×5=40."], "vid": {"t": "Corbettmaths: fractions of amounts (free video)", "u": "https://corbettmaths.com/2012/08/20/fractions-of-amounts/"}}, {"more": ["Fractions describe sales. 1/4 off means you take away a quarter of the price. Find the amount saved first, then subtract it from the original price.", "Another way is to find what you pay: 1/4 off means you pay 3/4."], "eg": ["Example 1: A £40 jacket with 1/4 off. 40÷4=10 saved. Pay £30.", "Example 2: A £60 bag with 1/3 off. 60÷3=20 saved. Pay £40.", "Example 3: A £24 game with 1/2 off costs £12."], "vid": {"t": "Corbettmaths: fractions of amounts (free video)", "u": "https://corbettmaths.com/2012/08/20/fractions-of-amounts/"}}, {"more": ["When denominators match, add or subtract only the numerators. The denominator tells the size of the pieces, and the pieces do not change.", "If your answer is above 1, you can write it as a mixed number."], "eg": ["Example 1: 2/7 + 3/7 = 5/7.", "Example 2: 7/9 − 4/9 = 3/9 = 1/3.", "Example 3: 5/6 + 4/6 = 9/6 = 1 3/6 = 1 1/2."], "vid": {"t": "Corbettmaths: adding fractions, same denominator (free video)", "u": "https://corbettmaths.com/2013/02/15/adding-fractions-same-denominator/"}}, {"more": ["When denominators differ, find a common denominator first, usually the lowest common multiple. Convert both fractions, then add or subtract the numerators.", "Always simplify at the end."], "eg": ["Example 1: 1/2 + 1/3. Use sixths: 3/6 + 2/6 = 5/6.", "Example 2: 3/4 − 1/8 = 6/8 − 1/8 = 5/8.", "Example 3: 2/3 + 1/4 = 8/12 + 3/12 = 11/12."], "vid": {"t": "Corbettmaths: adding and subtracting fractions (free video)", "u": "https://corbettmaths.com/2012/08/21/fractions-addition-and-subtraction/"}}, {"more": ["Mixed numbers can be added by adding the whole parts and fraction parts separately. If the fractions add to more than 1, carry a whole one.", "Or convert both to improper fractions and add. Choose whichever is easier."], "eg": ["Example 1: 1 1/4 + 2 1/4 = 3 2/4 = 3 1/2.", "Example 2: 2 3/5 + 1 4/5. Wholes 3, fractions 7/5 = 1 2/5. Total 4 2/5.", "Example 3: 3 − 1 1/4 = 1 3/4."], "vid": {"t": "Corbettmaths: mixed numbers to improper fractions (free video)", "u": "https://corbettmaths.com/2013/02/15/mixed-numbers-to-improper-fractions/"}}, {"more": ["Multiplying a fraction by a whole number means repeated addition. 3 × 2/5 is 2/5 + 2/5 + 2/5 = 6/5. Multiply the numerator by the whole number and keep the denominator.", "Then change to a mixed number if it is improper."], "eg": ["Example 1: 4 × 1/3 = 4/3 = 1 1/3.", "Example 2: 3 × 2/5 = 6/5 = 1 1/5.", "Example 3: 5 × 3/10 = 15/10 = 1 1/2."], "vid": {"t": "Corbettmaths: multiplying fractions (free video)", "u": "https://corbettmaths.com/2012/08/21/multiplying-fractions-2/"}}], "4.learn1": [{"more": ["Fractions, decimals and percentages are three ways to describe the same part of a whole. 1/2, 0.5 and 50% are all the same amount. Choose the form that suits the job: fractions for sharing, decimals for measuring, percentages for comparing.", "Knowing a few anchor values by heart makes everything else easier: 1/2, 1/4, 3/4, 1/5, 1/10."], "eg": ["Example 1: 1/4 = 0.25 = 25%.", "Example 2: 3/5 = 0.6 = 60%.", "Example 3: 1/10 = 0.1 = 10%."], "vid": {"t": "Corbettmaths: key fractions, decimals and percentages (free video)", "u": "https://corbettmaths.com/2013/04/24/key-fractions-decimals-and-percentages/"}}, {"more": ["Percent means out of 100. A hundred square makes this visible: 37% means 37 squares shaded out of 100. Because the whole is 100, percentages are easy to compare.", "To turn a fraction into a percentage, make the denominator 100. 3/20 = 15/100 = 15%."], "eg": ["Example 1: 7/10 = 70/100 = 70%.", "Example 2: 9/25 = 36/100 = 36%.", "Example 3: 45% = 45/100 = 9/20."], "vid": {"t": "Corbettmaths: fractions to percentages (free video)", "u": "https://corbettmaths.com/2013/03/29/fractions-to-percentages/"}}, {"more": ["Decimals and money go together. £3.45 is 3 pounds, 4 tenths of a pound (40p) and 5 hundredths (5p). Two decimal places is the standard for money.", "If you write £3.5 it should be £3.50. The final zero keeps the pence column."], "eg": ["Example 1: £2.05 is 2 pounds and 5 pence, not £2.50.", "Example 2: £0.60 = 60p.", "Example 3: 375p = £3.75."], "vid": {"t": "Corbettmaths: adding decimals (free video)", "u": "https://corbettmaths.com/2013/03/28/adding-decimals/"}}, {"more": ["Build any percentage from easy pieces. 10% is one tenth, so divide by 10. 5% is half of 10%. 1% is one hundredth, so divide by 100. Then add the pieces together.", "25% is a quarter and 50% is a half, so those are quick too."], "eg": ["Example 1: 15% of 80. 10% = 8, 5% = 4. Total 12.", "Example 2: 35% of 60. 10%=6 ×3 = 18, 5% = 3. Total 21.", "Example 3: 1% of 400 is 4."], "vid": {"t": "Corbettmaths: key fractions, decimals and percentages (free video)", "u": "https://corbettmaths.com/2013/04/24/key-fractions-decimals-and-percentages/"}}], "4.learn2": [{"more": ["To find a percentage of an amount, find 10% or 1% first and build up. Alternatively, write the percentage as a fraction and use fraction of an amount.", "Say what you are finding: 'twenty percent of sixty'. Then choose the method."], "eg": ["Example 1: 20% of 60. 10% = 6, so 20% = 12.", "Example 2: 75% of 80. 25% = 20, ×3 = 60.", "Example 3: 12% of 50. 10%=5, 1%=0.5, 2%=1, so 6."], "vid": {"t": "Corbettmaths: key fractions, decimals and percentages (free video)", "u": "https://corbettmaths.com/2013/04/24/key-fractions-decimals-and-percentages/"}}, {"more": ["A sale price: find the discount, then subtract it from the original price. Or find what you pay directly: 20% off means you pay 80%.", "Check: the sale price must be lower than the original."], "eg": ["Example 1: £50 with 20% off. 10% = 5, 20% = 10. Pay £40.", "Example 2: £80 with 15% off. 10% = 8, 5% = 4, discount 12. Pay £68.", "Example 3: £120 with 25% off. Discount 30. Pay £90."], "vid": {"t": "Corbettmaths: key fractions, decimals and percentages (free video)", "u": "https://corbettmaths.com/2013/04/24/key-fractions-decimals-and-percentages/"}}, {"more": ["To add decimals, line up the decimal points so that tenths sit under tenths. Fill gaps with zeros so each number has the same number of decimal places. Then add as normal, and put the decimal point straight down.", "Check with a rounded estimate."], "eg": ["Example 1: 3.45 + 2.8 = 3.45 + 2.80 = 6.25.", "Example 2: 12.6 + 0.75 = 13.35.", "Example 3: £4.99 + £2.50 = £7.49."], "vid": {"t": "Corbettmaths: adding decimals (free video)", "u": "https://corbettmaths.com/2013/03/28/adding-decimals/"}}, {"more": ["To convert, remember the links. Fraction to decimal: divide top by bottom or make the denominator 10 or 100. Decimal to percentage: multiply by 100. Percentage to fraction: put over 100 and simplify.", "Practice moving between the three forms until it is automatic."], "eg": ["Example 1: 3/4 = 75/100 = 0.75 = 75%.", "Example 2: 0.35 = 35% = 7/20.", "Example 3: 8% = 0.08 = 2/25."], "vid": {"t": "Corbettmaths: key fractions, decimals and percentages (free video)", "u": "https://corbettmaths.com/2013/04/24/key-fractions-decimals-and-percentages/"}}, {"more": ["Multiplying by 10, 100 or 1,000 moves every digit left by 1, 2 or 3 places, because each column is ten times bigger. Dividing moves digits right. The decimal point does not move, the digits do.", "Zeros act as placeholders when digits shift into empty columns."], "eg": ["Example 1: 4.7 × 10 = 47.", "Example 2: 0.36 × 100 = 36.", "Example 3: 520 ÷ 1,000 = 0.52."], "vid": {"t": "Corbettmaths: multiplying by 10, 100 and 1000 (free video)", "u": "https://corbettmaths.com/2013/06/06/multiplication-by-10-100-and-1000-2/"}}], "5.learn1": [{"more": ["We measure length in millimetres, centimetres, metres and kilometres; mass in grams and kilograms; capacity in millilitres and litres. Choose a unit sensible for the object.", "Small units for small things: a pencil in cm. Large units for large distances: a journey in km."], "eg": ["Example 1: A bus is about 10 m long.", "Example 2: A bag of sugar is 1 kg.", "Example 3: A cup holds about 250 ml."], "vid": {"t": "BBC: measurement videos", "u": "https://www.bbc.co.uk/teach/class-clips-video/articles/zfrmnk7"}}, {"more": ["To change units, use the conversion fact. 1 m = 100 cm, 1 km = 1,000 m, 1 kg = 1,000 g, 1 l = 1,000 ml. Going to a smaller unit, multiply. Going to a bigger unit, divide.", "Think: will I have more of the smaller unit? Then the number gets bigger."], "eg": ["Example 1: 3.5 m = 350 cm.", "Example 2: 2,400 g = 2.4 kg.", "Example 3: 0.75 l = 750 ml."], "vid": {"t": "BBC: measurement videos", "u": "https://www.bbc.co.uk/teach/class-clips-video/articles/zfrmnk7"}}, {"more": ["Perimeter is the distance around the outside of a shape. Add all the sides. Area is the amount of surface inside, counted in squares. For a rectangle: area = length × width.", "Perimeter is measured in units like cm; area in square units like cm²."], "eg": ["Example 1: A 6 cm by 4 cm rectangle has perimeter 20 cm and area 24 cm².", "Example 2: A square of side 5 m has perimeter 20 m and area 25 m².", "Example 3: Fencing is perimeter; carpet is area."], "vid": {"t": "Corbettmaths: area of a rectangle (free video)", "u": "https://corbettmaths.com/2013/12/20/area-of-a-rectangle-video-45/"}}, {"more": ["Garden problems combine both ideas. Decide first: does the question ask for the edge (fence, edging) or the surface (turf, paving)? Then choose perimeter or area.", "Draw a sketch and label the sides before calculating."], "eg": ["Example 1: A 8 m by 5 m lawn needs 26 m of edging and 40 m² of turf.", "Example 2: A square patio of 3 m needs 9 paving slabs of 1 m².", "Example 3: Fencing 10 m by 6 m costs 32 m × £8 = £256."], "vid": {"t": "Corbettmaths: area of a rectangle (free video)", "u": "https://corbettmaths.com/2013/12/20/area-of-a-rectangle-video-45/"}}, {"more": ["An L-shape can be split into two rectangles. Find each area and add, or take a missing corner away from a larger rectangle.", "Check that the dimensions you use for each part match the total lengths."], "eg": ["Example 1: An L made of 6×3 and 2×4 rectangles has area 18 + 8 = 26.", "Example 2: A 10×8 rectangle with a 4×3 corner cut away: 80 − 12 = 68.", "Example 3: Always label each part before multiplying."], "vid": {"t": "Corbettmaths: area of compound shapes (free video)", "u": "https://corbettmaths.com/2012/08/02/area-of-compound-shapes/"}}, {"more": ["Temperature can go below zero. On a number line, negative numbers are left of zero and get smaller as you go left. To find the difference between temperatures, count the steps between them.", "A temperature of −5 °C is colder than −2 °C."], "eg": ["Example 1: From −3 °C up to 4 °C is a rise of 7 degrees.", "Example 2: 2 °C falling by 6 degrees is −4 °C.", "Example 3: Order −1, −6, 3, 0 from coldest: −6, −1, 0, 3."], "vid": {"t": "Corbettmaths: negative numbers in real life (temperature) (free video)", "u": "https://corbettmaths.com/2013/05/15/negative-numbers-temperature/"}}], "5.learn2": [{"more": ["The 24-hour clock counts from 00:00 to 23:59, with no am or pm. After 12:00 noon, add 12 to get the 24-hour time. 3:15 pm becomes 15:15. Midnight is 00:00.", "To convert back, subtract 12 from any hour above 12."], "eg": ["Example 1: 7:30 pm = 19:30.", "Example 2: 21:45 = 9:45 pm.", "Example 3: 12:20 am = 00:20."], "vid": {"t": "BBC: measurement videos", "u": "https://www.bbc.co.uk/teach/class-clips-video/articles/zfrmnk7"}}, {"more": ["To find how long something takes, count on from the start to the next hour, then add the remaining minutes. Or subtract hours and minutes separately, exchanging 1 hour for 60 minutes if needed.", "A number line with jumps works very well for time."], "eg": ["Example 1: 09:40 to 11:15. 20 min to 10:00, 1 h to 11:00, 15 min. Total 1 h 35 min.", "Example 2: 13:50 to 15:10 is 1 h 20 min.", "Example 3: A film from 18:25 to 20:05 lasts 1 h 40 min."], "vid": {"t": "BBC: measurement videos", "u": "https://www.bbc.co.uk/teach/class-clips-video/articles/zfrmnk7"}}, {"more": ["To find a time after or before, add or subtract the duration, bridging through the hour. For a journey, find the arrival by adding; find the departure by taking away.", "Always check am/pm or 24-hour form."], "eg": ["Example 1: Leave 08:45, journey 50 min. Arrive 09:35.", "Example 2: Arrive 14:10, journey 1 h 25 min. Leave 12:45.", "Example 3: A bus at 17:50 plus 35 min arrives at 18:25."], "vid": {"t": "BBC: measurement videos", "u": "https://www.bbc.co.uk/teach/class-clips-video/articles/zfrmnk7"}}, {"more": ["A budget is a plan for spending. Add what you plan to spend and compare with what you have. Change is the money you have minus the cost.", "Keep money in pounds and pence, with two decimal places."], "eg": ["Example 1: £10 minus £3.45 = £6.55 change.", "Example 2: 3 items at £2.30 cost £6.90.", "Example 3: With £20, can you buy £8.99 + £7.50 + £4.25? Total £20.74. No, you are 74p short."], "vid": {"t": "Corbettmaths: adding decimals (money) (free video)", "u": "https://corbettmaths.com/2013/03/28/adding-decimals/"}}, {"more": ["Saving means putting money aside. Divide the target by the amount saved each week to find how many weeks are needed, and round up to the next whole week.", "Spending and saving together: income minus spending equals what is left to save."], "eg": ["Example 1: Save £4 a week for a £30 game: 30 ÷ 4 = 7.5, so 8 weeks.", "Example 2: Pocket money £6, spend £2.50, save £3.50.", "Example 3: After 5 weeks of £4 you have £20."], "vid": {"t": "Corbettmaths: adding decimals (money) (free video)", "u": "https://corbettmaths.com/2013/03/28/adding-decimals/"}}], "6.learn1": [{"more": ["A number pattern follows a rule. Find the difference between neighbouring terms. If the difference is always the same, the rule is add (or subtract) that number. If it is a multiplier, the rule is multiply.", "Describe the rule in words: 'start at 3 and add 4 each time'."], "eg": ["Example 1: 3, 7, 11, 15 adds 4.", "Example 2: 2, 6, 18, 54 multiplies by 3.", "Example 3: 50, 45, 40 subtracts 5."], "vid": {"t": "BBC: maths reasoning collection (video)", "u": "https://www.bbc.co.uk/teach/class-clips-video/articles/z4qhmfr"}}, {"more": ["Matchstick patterns grow in a regular way. Draw the next shape, count how many sticks it needs, and look for what changes each time.", "Record your counts in a table: pattern number and number of sticks."], "eg": ["Example 1: Squares in a row use 4, 7, 10 sticks. Each new square adds 3.", "Example 2: Triangles in a row: 3, 5, 7. Add 2 each time.", "Example 3: Predict the 10th shape from the table."], "vid": {"t": "BBC: maths reasoning collection (video)", "u": "https://www.bbc.co.uk/teach/class-clips-video/articles/z4qhmfr"}}, {"more": ["A rule for any pattern number lets you jump straight to the answer. For 4, 7, 10, the difference is 3, so start with 3 × n and then adjust: 3n + 1. Check with n = 1: 4 ✓.", "Write 'multiply the pattern number by 3 and add 1' in words first, then in letters."], "eg": ["Example 1: 5, 9, 13: 4n + 1.", "Example 2: Pattern 20: 4 × 20 + 1 = 81.", "Example 3: 3n gives 3, 6, 9, 12."], "vid": {"t": "BBC: maths reasoning collection (video)", "u": "https://www.bbc.co.uk/teach/class-clips-video/articles/z4qhmfr"}}, {"more": ["An input and output machine applies a rule to every number you put in. To find the rule, compare inputs with outputs. To go backwards, use the inverse operations in reverse order.", "Two-step rules do two things, like ×2 then +1."], "eg": ["Example 1: In 3, out 7; in 5, out 11. Rule ×2 + 1.", "Example 2: Rule +5: in 8, out 13.", "Example 3: Out is 17 with rule ×2 +1. Work back: 17−1=16, 16÷2=8."], "vid": {"t": "BBC: algebra and inverse operations (video)", "u": "https://www.bbc.co.uk/teach/class-clips-video/articles/z7jrkmn"}}], "6.learn2": [{"more": ["In algebra a letter stands for a number we may not know yet. 'n + 3' means any number plus 3. The letter is a variable if it can change, and an unknown if we want to find it.", "Writing 3n means 3 × n; we leave out the × sign."], "eg": ["Example 1: If n = 4, then n + 3 = 7.", "Example 2: If a = 5, then 3a = 15.", "Example 3: If x = 10, then x − 2 = 8."], "vid": {"t": "BBC: algebra and inverse operations (video)", "u": "https://www.bbc.co.uk/teach/class-clips-video/articles/z7jrkmn"}}, {"more": ["To solve a one-step equation, do the inverse operation on both sides. Subtract to undo adding, add to undo subtracting, divide to undo multiplying, multiply to undo dividing.", "Keep the equation balanced, like a pair of scales."], "eg": ["Example 1: x + 3 = 9, so x = 6.", "Example 2: 4x = 20, so x = 5.", "Example 3: x ÷ 2 = 7, so x = 14."], "vid": {"t": "Corbettmaths: solving equations (free video)", "u": "https://corbettmaths.com/2012/08/24/solving-equations/"}}, {"more": ["Two-step equations need two inverse steps, undoing the last operation first. For 2x + 3 = 11: take 3 away first (2x = 8), then divide by 2 (x = 4).", "Check by substituting your answer back."], "eg": ["Example 1: 3x − 2 = 13. Add 2: 3x = 15. Divide: x = 5.", "Example 2: x/2 + 1 = 6. Subtract 1: x/2 = 5. Multiply: x = 10.", "Example 3: 5x + 5 = 30 gives x = 5."], "vid": {"t": "Corbettmaths: solving equations (free video)", "u": "https://corbettmaths.com/2012/08/24/solving-equations/"}}, {"more": ["Word problems become equations once you pick a letter for the unknown. Read the sentence, write it as an equation, solve, then answer in words.", "'Think of a number, double it, add 3, the answer is 11' becomes 2n + 3 = 11."], "eg": ["Example 1: 'I think of a number and add 7 to get 15': n + 7 = 15, n = 8.", "Example 2: 3 pens cost £6: 3p = 6, p = £2.", "Example 3: 'Double a number and take 1 gives 9': 2n − 1 = 9, n = 5."], "vid": {"t": "Corbettmaths: forming and solving equations (free video)", "u": "https://corbettmaths.com/2013/04/20/forming-and-solving-equations/"}}, {"more": ["A formula is a rule written with letters. Substitute the values you know, then work out the answer using the correct order of operations.", "Common formulas: area of rectangle A = l × w, perimeter P = 2l + 2w."], "eg": ["Example 1: A = l × w with l = 7, w = 3 gives 21.", "Example 2: Cost C = 5n + 2 with n = 4 gives 22.", "Example 3: P = 2l + 2w with l = 6, w = 4 gives 20."], "vid": {"t": "Corbettmaths: solving equations (free video)", "u": "https://corbettmaths.com/2012/08/24/solving-equations/"}}], "7.learn1": [{"more": ["2D shapes are flat. We name them by counting sides: triangle 3, quadrilateral 4, pentagon 5, hexagon 6, heptagon 7, octagon 8. A regular shape has all sides and all angles equal.", "Quadrilaterals have special names: square, rectangle, rhombus, parallelogram, trapezium, kite."], "eg": ["Example 1: A stop sign is a regular octagon.", "Example 2: A honeycomb cell is a regular hexagon.", "Example 3: A kite has two pairs of equal neighbouring sides."], "vid": {"t": "BBC: geometry (video)", "u": "https://www.bbc.co.uk/teach/class-clips-video/articles/z49ygwx"}}, {"more": ["To tell shapes apart, look at the sides (equal? parallel?), the angles (right angles?) and the diagonals. A square is a rectangle with all sides equal; a rectangle is a parallelogram with right angles.", "Parallel lines stay the same distance apart and never meet."], "eg": ["Example 1: A rectangle has 4 right angles and opposite sides equal.", "Example 2: A rhombus has 4 equal sides but no right angles necessarily.", "Example 3: A trapezium has exactly one pair of parallel sides."], "vid": {"t": "BBC: geometry (video)", "u": "https://www.bbc.co.uk/teach/class-clips-video/articles/z49ygwx"}}, {"more": ["An angle measures a turn. A right angle is 90°. An acute angle is less than 90°. An obtuse angle is between 90° and 180°. A reflex angle is more than 180°. A full turn is 360°.", "Use a protractor: line up the zero line along one arm and read the scale from the arm."], "eg": ["Example 1: The corner of a book is 90°.", "Example 2: 130° is obtuse.", "Example 3: 250° is reflex."], "vid": {"t": "Corbettmaths: types of angle (free video)", "u": "https://corbettmaths.com/2012/08/10/types-of-angle/"}}, {"more": ["Four angle facts: angles on a straight line add to 180°; angles around a point add to 360°; angles in a triangle add to 180°; angles in a quadrilateral add to 360°. Use these to find missing angles without measuring.", "Vertically opposite angles, made when two lines cross, are equal."], "eg": ["Example 1: 180 − 65 = 115°.", "Example 2: Three angles 100°, 120° and ? around a point: 360 − 220 = 140°.", "Example 3: Quadrilateral with 90°, 90°, 100° and ?: 360 − 280 = 80°."], "vid": {"t": "Corbettmaths: angles around a point (free video)", "u": "https://corbettmaths.com/2012/08/10/angles-in-a-full-circle/"}}, {"more": ["Line symmetry: a shape has a line of symmetry if folding along it makes both halves match exactly. Rotational symmetry: the shape looks the same after turning less than a full turn.", "Count the number of times it fits to give the order of rotation."], "eg": ["Example 1: A rectangle has 2 lines of symmetry.", "Example 2: A square has 4 lines of symmetry and rotational symmetry of order 4.", "Example 3: The letter H has 2 lines of symmetry."], "vid": {"t": "BBC: geometry (video)", "u": "https://www.bbc.co.uk/teach/class-clips-video/articles/z49ygwx"}}, {"more": ["Coordinates give the exact position of a point. Write (x, y): go along first, then up. 'Along the corridor, then up the stairs.' The origin is (0, 0).", "Plot carefully and label the points."], "eg": ["Example 1: (3, 5) is 3 right and 5 up.", "Example 2: (0, 4) is on the vertical axis.", "Example 3: A rectangle with corners (1,1), (5,1), (5,3), (1,3)."], "vid": {"t": "Corbettmaths: coordinates (free video)", "u": "https://corbettmaths.com/2013/04/15/coordinates/"}}], "7.learn2": [{"more": ["The three angles in any triangle add up to 180°. If you know two, add them and take the total away from 180° to find the third.", "Check that your three angles do add to 180°."], "eg": ["Example 1: 50° and 60°. Missing angle 180 − 110 = 70°.", "Example 2: A right-angled triangle with one angle 35°: 180 − 90 − 35 = 55°.", "Example 3: An equilateral triangle has three 60° angles."], "vid": {"t": "Corbettmaths: angles in a triangle (free video)", "u": "https://corbettmaths.com/2012/08/10/angles-in-a-triangle/"}}, {"more": ["Angles on a straight line add up to 180°. If a straight line is split into two angles, subtract the known one from 180°.", "If more than two angles share a straight line, add the known ones first."], "eg": ["Example 1: 180 − 125 = 55°.", "Example 2: 40°, 70° and ?: 180 − 110 = 70°.", "Example 3: A right angle plus ? on a straight line: 90°."], "vid": {"t": "Corbettmaths: angles on a straight line (free video)", "u": "https://corbettmaths.com/2013/12/19/angles-straight-line-video-35/"}}, {"more": ["To count lines of symmetry, test each possible fold: vertical, horizontal and diagonal. Regular shapes have as many lines as sides.", "Do not forget diagonal lines on squares."], "eg": ["Example 1: Equilateral triangle: 3.", "Example 2: Regular pentagon: 5.", "Example 3: Circle: infinitely many."], "vid": {"t": "BBC: geometry (video)", "u": "https://www.bbc.co.uk/teach/class-clips-video/articles/z49ygwx"}}, {"more": ["To reflect a point, find its distance from the mirror line, then go the same distance on the other side. For a vertical mirror, the y value stays the same and the x value changes.", "Check that the point and its image are the same distance from the mirror."], "eg": ["Example 1: (2, 3) in the line x = 4 becomes (6, 3).", "Example 2: (1, 5) in the line y = 3 becomes (1, 1).", "Example 3: (0, 2) in the y axis becomes (0, 2) since it is on the line."], "vid": {"t": "Corbettmaths: coordinates and shapes (free video)", "u": "https://corbettmaths.com/2013/04/15/coordinates-and-shapes/"}}, {"more": ["3D shapes have faces (flat surfaces), edges (where faces meet) and vertices (corners). A cube has 6 faces, 12 edges and 8 vertices. Name shapes by their faces: a cuboid, a triangular prism, a square-based pyramid.", "Nets are 2D patterns that fold into 3D shapes."], "eg": ["Example 1: A square-based pyramid has 5 faces, 8 edges and 5 vertices.", "Example 2: A triangular prism has 5 faces, 9 edges and 6 vertices.", "Example 3: A cylinder has 3 faces (2 flat, 1 curved)."], "vid": {"t": "Corbettmaths: 3D shapes: vertices, edges, faces (free video)", "u": "https://corbettmaths.com/2013/12/27/edges-face-vertices-video-5/"}}], "8.learn1": [{"more": ["Data is information we collect. A tally chart records data quickly: one stroke for each, a gate of five. Count the tallies in fives to get totals.", "A frequency table shows the totals. Always add them up to check the total matches the number of people asked."], "eg": ["Example 1: |||| = 5, so |||| || = 7.", "Example 2: Favourite fruits: apple 8, banana 5, grape 7. Total 20.", "Example 3: Check: 8 + 5 + 7 = 20 ✓."], "vid": {"t": "Corbettmaths: reading bar charts (free video)", "u": "https://corbettmaths.com/2012/08/10/reading-bar-charts/"}}, {"more": ["A bar chart uses bars whose heights show amounts. Read the scale carefully: check what each gridline is worth. A pictogram uses symbols; read the key to see what one symbol means.", "The axes need labels, and the chart needs a title."], "eg": ["Example 1: If each ☺ represents 2 children, 4 ☺ means 8.", "Example 2: A bar between 20 and 30 on a scale in tens is 25 (halfway).", "Example 3: The tallest bar shows the most popular choice."], "vid": {"t": "Corbettmaths: reading bar charts (free video)", "u": "https://corbettmaths.com/2012/08/10/reading-bar-charts/"}}, {"more": ["A line graph shows how something changes over time, for example temperature through the day. Read across from the axis to the line, then down to the value.", "A rising line means increasing; a falling line means decreasing; flat means no change."], "eg": ["Example 1: At 12:00 the temperature was 14 °C.", "Example 2: The steepest part of the graph shows the fastest change.", "Example 3: Between 14:00 and 16:00 it fell by 3 degrees."], "vid": {"t": "BBC: maths reasoning collection (video)", "u": "https://www.bbc.co.uk/teach/class-clips-video/articles/z4qhmfr"}}, {"more": ["A pie chart shows how a whole is shared. Each slice is a fraction of the circle. A half-circle is 50%, a quarter is 25%. Compare slice sizes to compare amounts.", "If you know the total, find each slice's amount by fraction of an amount."], "eg": ["Example 1: A quarter of 40 children chose football: 10 children.", "Example 2: A slice of 50% out of 60 pupils: 30.", "Example 3: The biggest slice is the most popular."], "vid": {"t": "Corbettmaths: interpreting pie charts (free video)", "u": "https://corbettmaths.com/2013/05/25/interpreting-pie-charts/"}}, {"more": ["A Venn diagram uses overlapping circles to sort things that share properties. The overlap holds things that belong to both groups. A Carroll diagram sorts using yes/no boxes.", "Items outside every circle belong to neither group."], "eg": ["Example 1: Numbers up to 10 that are even or multiples of 3: 6 goes in the overlap.", "Example 2: In a Carroll diagram of 1 to 10, 3 goes in the box odd and smaller than 5.", "Example 3: If 10 like tea, 8 like juice and 4 like both, then 10 + 8 − 4 = 14 people were asked, because the overlap is counted once."], "vid": {"t": "BBC: maths reasoning collection (video)", "u": "https://www.bbc.co.uk/teach/class-clips-video/articles/z4qhmfr"}}], "8.learn2": [{"more": ["The mean is the 'fair share' average: add the numbers and divide by how many there are. The median is the middle value when ordered. The mode is the most common value. The range is the biggest minus the smallest.", "They answer different questions, so choose the right one."], "eg": ["Example 1: 4, 6, 8, 10, 12: mean 8, median 8, range 8.", "Example 2: 2, 3, 3, 5, 7: mode 3, median 3, mean 4.", "Example 3: Marks 7, 9, 10, 6: range 4."], "vid": {"t": "Corbettmaths: the mean (free video)", "u": "https://corbettmaths.com/2012/08/02/the-mean/"}}, {"more": ["To answer problems from a chart, read the question carefully, find the right bars or slices, read their values, then do the calculation. Say what the answer means.", "Always check units and scale."], "eg": ["Example 1: Bars 12 and 8: difference 4.", "Example 2: Total of three bars 8+5+7 = 20.", "Example 3: How many more chose pizza than pasta? Subtract."], "vid": {"t": "Corbettmaths: reading bar charts (free video)", "u": "https://corbettmaths.com/2012/08/10/reading-bar-charts/"}}, {"more": ["Probability describes how likely an event is. Words: impossible, unlikely, even chance, likely, certain. We can also use numbers from 0 (impossible) to 1 (certain).", "Place events on a probability line to compare."], "eg": ["Example 1: The sun will rise tomorrow: certain.", "Example 2: Flipping heads: even chance.", "Example 3: Rolling a 7 on a normal die: impossible."], "vid": {"t": "BBC: maths reasoning collection (video)", "u": "https://www.bbc.co.uk/teach/class-clips-video/articles/z4qhmfr"}}, {"more": ["Probability = number of ways it can happen ÷ total number of equally likely outcomes. Write it as a fraction in simplest form.", "Add the probabilities of all outcomes to check they total 1."], "eg": ["Example 1: A die showing 5: 1/6.", "Example 2: A bag with 3 red and 7 blue: chance of red is 3/10.", "Example 3: Even number on a die: 3/6 = 1/2."], "vid": {"t": "BBC: maths reasoning collection (video)", "u": "https://www.bbc.co.uk/teach/class-clips-video/articles/z4qhmfr"}}, {"more": ["Expected results: if you repeat an experiment many times, you expect about probability × number of trials. It is only an estimate.", "Real results can be a bit different, especially with few trials."], "eg": ["Example 1: Rolling a die 60 times, expect about 10 sixes.", "Example 2: Coin flipped 50 times: about 25 heads.", "Example 3: Probability 1/4 over 80 trials: about 20."], "vid": {"t": "BBC: maths reasoning collection (video)", "u": "https://www.bbc.co.uk/teach/class-clips-video/articles/z4qhmfr"}}], "9.learn1": [{"more": ["A good problem solver follows a plan: 1 Read and understand. 2 Choose a strategy. 3 Solve. 4 Check. Underline the question and circle the numbers.", "Understanding what is asked saves wasted effort."], "eg": ["Example 1: 'How many altogether?' suggests adding.", "Example 2: 'How much change?' suggests subtracting.", "Example 3: Say the problem in your own words first: 'I know 5 bags with 8 apples each, I want the total', so 5 × 8 = 40."], "vid": {"t": "BBC: maths reasoning collection (video)", "u": "https://www.bbc.co.uk/teach/class-clips-video/articles/z4qhmfr"}}, {"more": ["A bar model draws numbers as bars so you can see how they relate. Draw one bar for the total and split it into parts. It works for ratio, fractions and word problems.", "Label the bars with what you know and a ? for what you want."], "eg": ["Example 1: Total 36 split 2 : 1. Three equal parts of 12: 24 and 12.", "Example 2: Ali has 5 more than Ben, total 25: Ben 10, Ali 15.", "Example 3: A bar of 5 equal parts totalling 40 has parts of 8."], "vid": {"t": "BBC: maths reasoning collection (video)", "u": "https://www.bbc.co.uk/teach/class-clips-video/articles/z4qhmfr"}}, {"more": ["Working backwards starts from the end and undoes each step using inverse operations, in reverse order.", "Check by running the steps forward from your answer."], "eg": ["Example 1: 'Double a number, add 3, get 17': 17−3=14, 14÷2=7.", "Example 2: End with £15 after spending £5 and then half: before the half it was £30, so £35 at the start.", "Example 3: Check: 7 doubled is 14, plus 3 is 17 ✓."], "vid": {"t": "Corbettmaths: forming and solving equations (free video)", "u": "https://corbettmaths.com/2013/04/20/forming-and-solving-equations/"}}, {"more": ["Guess, test and improve: make a sensible guess, test it against the clues, then adjust up or down using what the test shows. Keep a table of guesses.", "Each wrong guess narrows the range."], "eg": ["Example 1: Two numbers total 20 and multiply to 91: try 7 and 13 ✓.", "Example 2: Guess 6 and 14: 84, too low; try 7 and 13: 91 ✓.", "Example 3: 7 + 13 = 20 and 7 × 13 = 91, so both clues are satisfied."], "vid": {"t": "BBC: maths reasoning collection (video)", "u": "https://www.bbc.co.uk/teach/class-clips-video/articles/z4qhmfr"}}, {"more": ["Verbal reasoning puzzles use words and logic. Read each clue slowly, mark what you learn in a table, and cross out impossibilities.", "Eliminate wrong options until one remains."], "eg": ["Example 1: Three children own a cat, a dog and a fish. Clue: Sam does not have the cat or the dog. So Sam has the fish.", "Example 2: Odd one out: apple, pear, carrot, plum: carrot is a vegetable.", "Example 3: Analogy: hot is to cold as up is to down, because each pair are opposites."], "vid": {"t": "BBC: maths reasoning collection (video)", "u": "https://www.bbc.co.uk/teach/class-clips-video/articles/z4qhmfr"}}], "9.learn2": [{"more": ["Non-verbal reasoning uses shapes. Look at how the pattern changes: size, colour, number, position, rotation. Describe the change in words and apply it to find the next shape.", "Look for more than one change at a time."], "eg": ["Example 1: A shape rotating 90° each time.", "Example 2: One extra dot each step.", "Example 3: Colours alternate black, white, black, white, so the 7th shape is black."], "vid": {"t": "BBC: maths reasoning collection (video)", "u": "https://www.bbc.co.uk/teach/class-clips-video/articles/z4qhmfr"}}, {"more": ["In a magic square, every row, column and diagonal has the same total. Find the magic total, then fill each gap by subtracting known numbers from it.", "Start with the line that has most numbers filled in."], "eg": ["Example 1: 3×3 with numbers 1 to 9: magic total 15.", "Example 2: A row reads 2, ?, 6 and the magic total is 15, so ? = 15 − 2 − 6 = 7.", "Example 3: In the 1 to 9 magic square the centre cell is always 5."], "vid": {"t": "BBC: maths reasoning collection (video)", "u": "https://www.bbc.co.uk/teach/class-clips-video/articles/z4qhmfr"}}, {"more": ["Number grids follow rules across the rows and down the columns. Find the rule that links neighbouring numbers, then use it for the missing one.", "Test your rule on a row you can already see."], "eg": ["Example 1: Rows add 3 each step: 2, 5, 8, 11.", "Example 2: Columns add 10: 4, 14, 24.", "Example 3: In a times-table grid each cell is the row number times the column number, so row 4, column 6 is 24."], "vid": {"t": "BBC: maths reasoning collection (video)", "u": "https://www.bbc.co.uk/teach/class-clips-video/articles/z4qhmfr"}}, {"more": ["Multi-step problems need several calculations. Break them into smaller questions, write each step and its answer, then combine.", "Show every step so you can find any slip."], "eg": ["Example 1: 3 tickets at £8 and 2 drinks at £2: 24 + 4 = £28.", "Example 2: £50 − £28 = £22 change.", "Example 3: 'A class of 28 splits into teams of 4, each team needs 3 pens': teams 28 ÷ 4 = 7, pens 7 × 3 = 21."], "vid": {"t": "Corbettmaths: order of operations (BODMAS) (free video)", "u": "https://corbettmaths.com/2013/06/08/order-of-operations/"}}, {"more": ["Always check your answer. Does it answer the question? Is it sensible? Estimate. Use the inverse. Reread the question.", "Checking is a habit that gets better marks."], "eg": ["Example 1: 49 × 6 ≈ 50 × 6 = 300; answer 294 ✓.", "Example 2: 294 ÷ 6 = 49 ✓.", "Example 3: A bus journey of 3 hours cannot be 400 minutes, because 3 hours is 180 minutes. The check shows the slip."], "vid": {"t": "BBC: maths reasoning collection (video)", "u": "https://www.bbc.co.uk/teach/class-clips-video/articles/z4qhmfr"}}], "10.learn1": [{"more": ["Multiples go on forever, so there is no biggest multiple. What matters is spotting them quickly, and the times tables are the fastest tool.", "Multiples also link to division. If a number is a multiple of 6, then 6 divides into it exactly. That gives a simple test: divide and check the remainder is zero."], "eg": ["Example 1: The multiples of 4 are 4, 8, 12, 16, 20. The 7th multiple is 7 × 4 = 28.", "Example 2: Is 56 a multiple of 8? 56 ÷ 8 = 7 exactly, so yes.", "Example 3: Is 50 a multiple of 8? 8 × 6 = 48 and 8 × 7 = 56, so 50 falls between them. No."]}, {"more": ["Factors and multiples are two sides of one fact. Since 3 × 4 = 12, the numbers 3 and 4 are factors of 12, and 12 is a multiple of both 3 and 4.", "Every number has 1 and itself as factors. A rectangle of dots helps: every way to make a rectangle of 12 dots with no gaps shows a factor pair."], "eg": ["Example 1: 3 × 5 = 15 shows that 3 and 5 are factors of 15.", "Example 2: Is 7 a factor of 42? 7 × 6 = 42, so yes.", "Example 3: Is 5 a factor of 42? 42 does not end in 0 or 5, so no."]}, {"more": ["The safe way to find every factor is to work in order: test 1, then 2, then 3, and write each pair as you find it. Stop when the next number you try is already in your list.", "Writing the pairs side by side means you never miss one, and you can count the factors at the end."], "eg": ["Example 1: Factors of 18: 1 × 18, 2 × 9, 3 × 6. The list is 1, 2, 3, 6, 9, 18.", "Example 2: Factors of 20: 1 × 20, 2 × 10, 4 × 5. The list is 1, 2, 4, 5, 10, 20. (3 does not divide 20.)", "Example 3: Factors of 16: 1 × 16, 2 × 8, 4 × 4. The list is 1, 2, 4, 8, 16, with 4 counted once."]}, {"more": ["To find a highest common factor, list the factors of both numbers, circle the ones that match, and choose the biggest. It gives the largest equal size that fits both amounts exactly.", "The HCF is also used to simplify fractions: divide the top and bottom by their HCF in one step."], "eg": ["Example 1: HCF of 8 and 12. Factors of 8: 1, 2, 4, 8. Factors of 12: 1, 2, 3, 4, 6, 12. Common: 1, 2, 4. HCF = 4.", "Example 2: HCF of 15 and 25 is 5.", "Example 3: Simplify 12/18 using the HCF 6: 12 ÷ 6 = 2 and 18 ÷ 6 = 3, so 2/3."]}, {"more": ["To find a lowest common multiple, write the multiples of each number in order and stop at the first number that appears in both lists. Always start from the first multiple, not zero.", "The LCM is the answer to questions about things happening together again: buses, flashing lights and repeating patterns."], "eg": ["Example 1: LCM of 3 and 5. Multiples of 3: 3, 6, 9, 12, 15. Multiples of 5: 5, 10, 15. LCM = 15.", "Example 2: LCM of 6 and 8 is 24.", "Example 3: Two lights flash every 4 and 10 seconds. They flash together every 20 seconds."]}], "10.learn2": [{"more": ["Prime numbers are the building blocks of all whole numbers, because every number can be made by multiplying primes. That is why they matter so much in maths.", "To decide, count the factors. Two factors means prime, more than two means composite. The number 1 has only one factor, so it is neither."], "eg": ["Example 1: 13 has factors 1 and 13 only, so it is prime.", "Example 2: 15 has factors 1, 3, 5 and 15, so it is composite.", "Example 3: The primes up to 20 are 2, 3, 5, 7, 11, 13, 17 and 19."]}, {"more": ["To test a number for being prime you only need to try the small primes: 2, 3, 5 and 7. If none of these divide it, then for numbers under 100 it is prime.", "Use the divisibility rules to speed this up. Check the last digit for 2 and 5, and the digit sum for 3."], "eg": ["Example 1: Is 29 prime? Not even, does not end in 5, digit sum 11 is not in the 3 times table, and 7 × 4 = 28 misses it. So 29 is prime.", "Example 2: Is 91 prime? 7 × 13 = 91, so no.", "Example 3: Is 87 prime? Digit sum 15 is in the 3 times table, so 3 divides it. 87 = 3 × 29, so no."]}, {"more": ["Divisibility rules save time because they replace long division with a quick look at the digits.", "The rule for 4 looks at the last two digits: if they form a multiple of 4, so is the whole number. The rule for 6 is both the rule for 2 and the rule for 3."], "eg": ["Example 1: Is 2,340 divisible by 5? It ends in 0, so yes.", "Example 2: Is 4,128 divisible by 3? 4 + 1 + 2 + 8 = 15, and 15 is in the 3 times table. Yes.", "Example 3: Is 7,254 divisible by 9? 7 + 2 + 5 + 4 = 18, a multiple of 9. Yes."]}, {"more": ["A square number can be drawn as a square of dots. The side length is the number you square. A bigger side means a much bigger square: 10² is 100, but 20² is 400.", "Square numbers grow by the odd numbers: 1, then add 3 to get 4, add 5 to get 9, add 7 to get 16, and so on."], "eg": ["Example 1: 7² = 7 × 7 = 49.", "Example 2: Is 50 a square number? 7 × 7 = 49 and 8 × 8 = 64, so no.", "Example 3: A square garden with 9 m sides has an area of 9 × 9 = 81 m²."]}, {"more": ["Triangular numbers count the dots in a triangle: 1, 3, 6, 10, 15, 21, 28. Each new row adds one more dot than the row before.", "The gaps between triangular numbers are 2, 3, 4, 5, 6 and so on, so you can build the sequence by adding a bigger number each time."], "eg": ["Example 1: The 5th triangular number is 1 + 2 + 3 + 4 + 5 = 15.", "Example 2: After 21 the gap is 7, so the next triangular number is 28.", "Example 3: Two triangular numbers can add to a square number: 6 + 10 = 16."]}, {"more": ["Packing problems ask which group sizes leave nothing over. Those sizes are exactly the factors of the total.", "Read the question for limits, such as 'more than one in a box'. Those rules remove some factors from the list."], "eg": ["Example 1: 30 sweets in equal bags: bag sizes 1, 2, 3, 5, 6, 10, 15 or 30.", "Example 2: 30 sweets, at least 5 in a bag, no sweets left: 5, 6, 10, 15 or 30.", "Example 3: A class of 28 splits into equal teams of 4: 28 ÷ 4 = 7 teams."]}], "501.learn1": [{"more": ["A digit on its own is just a symbol. Its column gives it a value. The same digit 5 is worth 5 in the ones column, 500 in the hundreds column and 50,000 in the ten thousands column.", "Numbers up to 100,000 have five columns: ones, tens, hundreds, thousands and ten thousands. One hundred thousand is the first six-digit number."], "eg": ["Example 1: In 62,408 the 6 is worth 60,000 and the 2 is worth 2,000.", "Example 2: In 35,170 the 1 is worth 100 and the 7 is worth 70.", "Example 3: In 90,005 the 9 is worth 90,000 and the 5 is worth 5."]}, {"more": ["Ten ones make one ten. Ten tens make one hundred. Ten hundreds make one thousand. Ten thousands make one ten thousand. The pattern repeats all the way along.", "This is why multiplying by 10 moves every digit one column to the left, and dividing by 10 moves every digit one column to the right."], "eg": ["Example 1: 7 × 10 = 70, because the 7 moves from the ones to the tens column.", "Example 2: 4,500 ÷ 10 = 450, because each digit moves one column right.", "Example 3: 38 × 100 = 3,800, because each digit moves two columns left."]}, {"more": ["Zero is not nothing. It is a place holder. It tells us the column is empty so the other digits stay in their correct columns.", "When we read a number we skip the zero columns, but we must still write them."], "eg": ["Example 1: 40,300 has no thousands, no tens and no ones. It is forty thousand, three hundred.", "Example 2: 5,070 is five thousand and seventy. The zero in the hundreds column matters.", "Example 3: 2,000 + 6 = 2,006, not 26. The zeros hold the tens and hundreds."]}, {"more": ["To order numbers, first compare how many digits they have. A number with more digits is bigger. If the lengths match, compare digit by digit from the left.", "Expanded form helps us see the value of every digit and makes comparing easier."], "eg": ["Example 1: 9,870 and 12,004. The second has five digits, so it is bigger.", "Example 2: 45,620 and 45,260. The ten thousands and thousands match. The hundreds are 6 and 2, so 45,620 is bigger.", "Example 3: 70,000 + 3,000 + 40 + 8 = 73,048."]}, {"more": ["Decimals continue the pattern to the right of the point. Each column is ten times smaller than the one on its left, so a tenth is ten times bigger than a hundredth.", "When you compare decimals, the number of digits does not decide. 0.7 has one digit but it is bigger than 0.65, because 7 tenths is more than 6 tenths."], "eg": ["Example 1: 0.3 is three tenths. 0.03 is three hundredths. They are different sizes.", "Example 2: £2.50 is 2 pounds and 5 ten-pences. £2.05 is 2 pounds and 5 pennies.", "Example 3: 4.8 and 4.75. Write 4.8 as 4.80. 4.80 is bigger than 4.75."]}], "501.learn2": [{"more": ["Rounding is not guessing. It follows a rule, so everybody who rounds the same number to the same place gets the same answer.", "The sign ≈ means about equal to. We use it because a rounded number is close to the exact number but not the same."], "eg": ["Example 1: 28 people ≈ 30 people.", "Example 2: £4.95 ≈ £5.", "Example 3: 4,081 steps ≈ 4,000 steps."]}, {"more": ["To round to the nearest 10, the ones digit decides. Zero to four goes down. Five to nine goes up.", "Rounding up from a 9 in the tens column causes a carry. 396 rounds to 400 because 39 tens plus 1 more ten makes 40 tens."], "eg": ["Example 1: 83 rounds to 80 because the ones digit 3 is less than 5.", "Example 2: 2,457 rounds to 2,460 because the ones digit 7 is 5 or more.", "Example 3: 596 rounds to 600. The 9 becomes 10 and carries."]}, {"more": ["To round to the nearest 100, the tens digit decides. Underline the hundreds digit and look next door.", "A number line with the two hundreds either side shows which is nearer."], "eg": ["Example 1: 3,260 rounds to 3,300 because the tens digit is 6.", "Example 2: 12,349 rounds to 12,300 because the tens digit is 4.", "Example 3: 8,950 rounds to 9,000. 8,950 is exactly halfway between 8,900 and 9,000, so it goes up."]}, {"more": ["For the nearest 1,000 the hundreds digit decides. For the nearest 10,000 the thousands digit decides. The method never changes: find the digit, look next door, and use zeros to fill in.", "The halfway number always rounds up. This is a rule everyone agrees on."], "eg": ["Example 1: 7,499 rounds to 7,000 and 7,500 rounds to 8,000.", "Example 2: 46,812 rounds to 47,000.", "Example 3: 99,600 rounds to 100,000."]}, {"more": ["A decimal rounded to the nearest whole number depends on the tenths digit only. The hundredths digit does not matter.", "Money is often rounded to the nearest pound in your head."], "eg": ["Example 1: 5.3 rounds to 5.", "Example 2: 8.5 rounds to 9.", "Example 3: 12.49 rounds to 12. The tenths digit 4 decides, and the 9 in the hundredths does not change this."]}, {"more": ["Estimating saves time and checks answers. Round each number to one big digit, then calculate.", "If an exact answer and an estimate are very different, look for a mistake."], "eg": ["Example 1: 297 + 304 ≈ 300 + 300 = 600.", "Example 2: 5,980 − 2,020 ≈ 6,000 − 2,000 = 4,000.", "Example 3: 19 × 4 ≈ 20 × 4 = 80."]}]};
/* P6 Maths Studio: engine. Topics register themselves with Studio.addTopic and are shown as tabs. */
(function () {
  'use strict';
  var S = window.Studio = { topics: {}, order: [], gens: {}, h: {}, viz: {} };
  var $ = function (id) { return document.getElementById(id); };
  var rnd = function (a, b) { return a + Math.floor(Math.random() * (b - a + 1)); };
  var fmtInt = function (n) { return Number(n).toLocaleString('en-GB'); };
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function trimNum(x) { return String(Number(Number(x).toFixed(4))); }
  function money(x) { return '£' + (Math.round(x * 100) / 100).toFixed(2); }
  function gcd(a, b) { return b ? gcd(b, a % b) : Math.abs(a); }
  function lcm(a, b) { return a / gcd(a, b) * b; }
  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/"/g, '&quot;'); }
  function fmtT(v, dec) { var s = fmtInt(Math.floor(v / 1000)); if (dec > 0) s += '.' + String(v % 1000).padStart(3, '0').slice(0, dec); return s; }

  var ONES = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  var TENS = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  function w100(n) { if (n < 20) return ONES[n]; var t = Math.floor(n / 10), o = n % 10; return TENS[t] + (o ? '-' + ONES[o] : ''); }
  function w1000(n) { var h = Math.floor(n / 100), r = n % 100, s = ''; if (h) s += ONES[h] + ' hundred'; if (r) s += (h ? ' and ' : '') + w100(r); return s; }
  function words(n) {
    if (n === 0) return 'zero';
    var th = Math.floor(n / 1000), r = n % 1000, s = '';
    if (th) s += w1000(th) + ' thousand';
    if (r) { if (th) s += (r < 100 ? ' and ' : ', '); s += w1000(r); }
    return s;
  }
  S.h = { $: $, rnd: rnd, fmtInt: fmtInt, shuffle: shuffle, pick: pick, trimNum: trimNum, money: money, gcd: gcd, lcm: lcm, esc: esc, fmtT: fmtT, words: words, ONES: ONES };

  /* ================= storage ================= */
  var store = { progress: {}, warmHistory: {}, settings: { rate: 1, voice: '', auto: false, large: false, difficulty: '', readMode: false, year: 'P6' } };
  try {
    var raw = localStorage.getItem('pm-studio');
    if (raw) { var o = JSON.parse(raw); if (o && o.progress) store.progress = o.progress; if (o && o.warmHistory) store.warmHistory = o.warmHistory; if (o && o.settings) Object.assign(store.settings, o.settings); }
  } catch (e) { /* storage unavailable: progress lasts this visit only */ }
  store.settings.readMode = false; store.settings.auto = false; /* voice always starts off each visit */
  function save() { try { localStorage.setItem('pm-studio', JSON.stringify(store)); } catch (e) { /* ignore */ } }
  function pkey(n) { return 't' + n; }
  function markDone(n, step) { var p = store.progress[pkey(n)] = store.progress[pkey(n)] || { steps: {} }; if (!p.steps) p.steps = {}; if (!p.steps[step]) { p.steps[step] = true; save(); } }
  function isDone(n, step) { var p = store.progress[pkey(n)]; return !!(p && p.steps && p.steps[step]); }
  function best(n) { var p = store.progress[pkey(n)]; return (p && p.best) || 0; }
  function setBest(n, sc) { var p = store.progress[pkey(n)] = store.progress[pkey(n)] || { steps: {} }; if (!p.best || sc > p.best) { p.best = sc; save(); } }
  S.h.markDone = markDone;
  S.h.slideMeta = { goals: SLIDE_GOALS, more: SLIDE_MORE };

  /* ================= narrator ================= */
  var Nar = { ok: ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window), voices: [], units: [], token: 0, at: 0, playing: false, err: '' };
  function speakable(t) {

function genIsMultiple() {

function genDivRule() {

<script>

  s += '<line x1="' + x0 + '" y1="46" x2="' + x1 + '" y2="46" style="stroke:var(--fg);stroke-width:3"/>';
  for (var i = 0; i <= n; i++) {

  }

}
function colChart(n) {

/* ---------- labs ---------- */
function mountBuildLab(host, ctx) {
  var d = [0, 0, 0, 0, 0], goals = 0, target;
  function newTarget() { target = rnd(1, 9) * 10000 + rnd(0, 9) * 1000 + rnd(0, 9) * 100 + rnd(0, 9) * 10 + rnd(0, 9); }
  function val() { return d[0] * 10000 + d[1] * 1000 + d[2] * 100 + d[3] * 10 + d[4]; }

  function draw() {
    var v = val(), ok = v === target;
    host.innerHTML = '<p class="say wq">Build the number <b>' + fmtInt(target) + '</b> by tapping the arrows on each column.</p><div class="lab-grid" style="grid-template-columns:repeat(5,1fr);text-align:center">' +
      d.map(function (x, i) { return '<div><div class="note" style="min-height:0;font-size:.78rem">' + COLS[i] + '</div><button class="btn ghost" data-up="' + i + '" type="button" aria-label="More ' + COLS[i] + '">▲</button><div class="pv-b" style="font-size:1.8rem;padding:4px 0">' + x + '</div><button class="btn ghost" data-dn="' + i + '" type="button" aria-label="Fewer ' + COLS[i] + '">▼</button></div>'; }).join('') + '</div>' +
      '<div class="lab-out say" aria-live="polite">Your number: ' + fmtInt(v) + (ok ? ' ✓ That is it!' : '') + '</div>' +
      '<div class="explain">' + d.map(function (x, i) { return x ? x * Math.pow(10, 4 - i) : null; }).filter(function (x) { return x !== null; }).map(fmtInt).join(' + ') + (v ? '' : '0') + '</div>' +
      '<p class="note">Numbers built: ' + goals + ' of 3</p>' + (ok ? '<div class="tools"><button class="btn" id="bNext" type="button">' + (goals >= 3 ? 'Well done' : 'Next number') + '</button></div>' : '');

    if (ok) {
      if (!draw.counted) { goals++; draw.counted = true; if (goals >= 3) ctx.complete(); }

function mountRoundLab(host, ctx) {
  var n = 4638, place = 100, seen = {};

    '<label class="eyebrow" for="rN">Choose a number</label><input class="slider" id="rN" type="range" min="1000" max="9999" value="4638" style="width:100%">' +
    '<div class="tools"><button class="btn" data-pl="10" type="button">Nearest 10</button><button class="btn" data-pl="100" type="button">Nearest 100</button><button class="btn" data-pl="1000" type="button">Nearest 1,000</button></div><div class="explain" id="rExp"></div><p class="note" id="rNote"></p>';

  { title: 'Every digit has a place', v: function () { return colChart(34527) + '<div class="caption">34,527: the 4 is in the thousands column, so it is worth 4,000</div>'; },

var LEARN2 = [

/* ---------- questions ---------- */
function genWarm() {
  var a = rnd(2, 9), b = rnd(2, 9), n = rnd(11, 89) * 10 + rnd(1, 9);
  return shuffle([
    Q({ tag: 'Mental maths', text: 'What is <b>' + a + ' × 10</b>?', answer: String(a * 10), hints: ['Multiplying by 10 moves each digit one column to the left.', 'Write the number, then a zero to hold the ones place.'], explain: a + ' × 10 = ' + (a * 10) + '.' }),
    Q({ tag: 'Mental maths', text: 'What is <b>' + (b * 100) + ' ÷ 10</b>?', answer: String(b * 10), hints: ['Dividing by 10 moves each digit one column to the right.', 'Take one zero away from the end.'], explain: (b * 100) + ' ÷ 10 = ' + (b * 10) + '.' }),
    Q({ tag: 'Mental maths', text: 'What is the <b>tens digit</b> in <b>' + n + '</b>?', answer: String(Math.floor(n / 10) % 10), hints: ['The ones digit is the last digit. The tens digit is next to it.', 'Count one column to the left of the ones.'], explain: 'In ' + n + ' the tens digit is ' + (Math.floor(n / 10) % 10) + '.' }),
    Q({ tag: 'Mental maths', text: 'What is <b>' + (a + b) + ' + ' + a + '</b>?', answer: String(2 * a + b), hints: ['Add the ones carefully.', 'Start with ' + (a + b) + ' and count on ' + a + '.'], explain: (a + b) + ' + ' + a + ' = ' + (2 * a + b) + '.' }),
    Q({ tag: 'Mental maths', text: 'What is <b>half of ' + (b * 20) + '</b>?', answer: String(b * 10), hints: ['Half means divide by 2.', 'Halve the tens first, then the ones.'], explain: 'Half of ' + (b * 20) + ' is ' + (b * 10) + '.' })
  ]).slice(0, 4);
}
function genValue() {
  var n = rnd(10000, 99999), i = rnd(0, 4), d = digitsOf(n, 5)[i];
  if (d === 0) { d = rnd(1, 9); var ds = digitsOf(n, 5); ds[i] = d; n = Number(ds.join('')); }
  var shown = fmtInt(n);
  return Q({ tag: 'Place value', text: 'What is the value of the digit <b>' + d + '</b> in the <b>' + COLS[i] + '</b> column of <b>' + shown + '</b>?', answer: String(d * Math.pow(10, 4 - i)),
    hints: ['Find the ' + COLS[i] + ' column in the number.', 'The value is the digit times the value of its column.'], explain: 'In ' + shown + ' the ' + d + ' is in the ' + COLS[i] + ' column. Its value is ' + d + ' × ' + fmtInt(Math.pow(10, 4 - i)) + ' = ' + fmtInt(d * Math.pow(10, 4 - i)) + '.' });
}
function genExpanded() {
  var n = rnd(10000, 99999), d = digitsOf(n, 5), pos = rnd(1, 3);
  if (d[pos] === 0) { d[pos] = rnd(1, 9); n = Number(d.join('')); }
  var parts = d.map(function (x, i) { return x * Math.pow(10, 4 - i); }), missing = parts[pos];
  var shown = parts.map(function (p, i) { return i === pos ? '?' : fmtInt(p); }).filter(function (x, i) { return parts[i] !== 0 || i === pos; }).join(' + ');
  return Q({ tag: 'Place value', text: fmtInt(n) + ' = ' + shown + '. What is the missing number?', answer: String(missing),
    hints: ['Expanded form shows the value of each digit added together.', 'Go column by column and find the digit that has no part shown, then say what it is worth.'], explain: 'The missing part is ' + fmtInt(missing) + '.' });
}
function genOrder() {
  var base = rnd(10, 90) * 1000, nums = [];
  while (nums.length < 4) { var x = base + rnd(1, 9) * pick([1, 10, 100, 1000]) + rnd(0, 9); if (nums.indexOf(x) === -1) nums.push(x); }
  var big = Math.random() < 0.5, sorted = nums.slice().sort(function (a, b) { return a - b; }), ans = big ? sorted[3] : sorted[0];
  return Q({ tag: 'Ordering numbers', type: 'mc', text: 'Which is the <b>' + (big ? 'largest' : 'smallest') + '</b> of these numbers: ' + nums.map(fmtInt).join(', ') + '?', options: shuffle(nums.map(fmtInt)), answer: fmtInt(ans),
    hints: ['Compare the numbers starting from the left, at the biggest column.', 'If two numbers have the same digit, move one column to the right.'], explain: 'The ' + (big ? 'largest' : 'smallest') + ' is ' + fmtInt(ans) + '. Compare the digits from the left.' });
}
function genDecCompare() {
  var a = rnd(1, 9), b = rnd(1, 9), x, y;
  x = a / 10; y = (b + (a === b ? 1 : 0)) % 10 / 10 + 0.0; var d2 = rnd(1, 9);
  var p = trimNum(a / 10), q = trimNum((a * 10 + d2 - (d2 > 5 ? 10 : 0) * 0) / 100);
  var big = (a * 10 + 0) > (a * 10 + d2) ? p : q;
  // make a pair like 0.6 and 0.58
  var t1 = rnd(2, 8), h = rnd(1, 9), left = t1 / 10, right = (t1 - 1) / 10 + (h / 100) ;
  right = Math.round(right * 100) / 100;
  var ans = left > right ? left : right;
  return Q({ tag: 'Decimals', type: 'mc', text: 'Which is <b>bigger</b>: <b>' + trimNum(left) + '</b> or <b>' + trimNum(right) + '</b>?', options: shuffle([trimNum(left), trimNum(right)]), answer: trimNum(ans),
    hints: ['Write both with the same number of decimal places, so each has tenths and hundredths.', 'Compare the tenths first.'], explain: trimNum(left) + ' = ' + (Math.round(left * 100) / 100).toFixed(2) + ' and ' + trimNum(right) + ' = ' + right.toFixed(2) + '. ' + ans.toFixed(2) + ' is bigger.' });
}
function genDecValue() {
  var w = rnd(1, 9), t = rnd(2, 9), h = rnd(2, 9), where = pick(['tenths', 'hundredths']), val = where === 'tenths' ? t / 10 : h / 100;
  return Q({ tag: 'Decimals', text: 'What is the value of the <b>' + (where === 'tenths' ? t : h) + '</b> in the ' + where + ' column of <b>' + w + '.' + t + h + '</b>?', answer: trimNum(val),
    hints: ['The first column after the point is tenths. The second is hundredths.', 'A tenth is 0.1 and a hundredth is 0.01. Multiply the digit by its column value.'], explain: 'The ' + (where === 'tenths' ? t : h) + ' is in the ' + where + ' column, worth ' + trimNum(val) + '.' });
}
function genRound(place) {
  var n = rnd(1000, 99999), r = Math.round(n / place) * place, pn = place === 10 ? 'tens' : place === 100 ? 'hundreds' : 'thousands';
  if ((n % place) * 2 === place) r = n - (n % place) + place;

  var lo = n - (n % place);
