<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>P6 Maths Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: one calm column. Home shows the course map; a lesson is a stepper of read-and-listen slides, hands-on labs and practice. A listening bar sits at the bottom. */
:root {
  --bg: #F3F6FC;
  --surface: #FFFFFF;
  --surface-2: #E9EFFA;
  --fg: #17233F;
  --muted: #546080;
  --line: #CBD6EC;
  --accent: #2B62D9;
  --accent-fg: #FFFFFF;
  --good: #187A4E;
  --good-bg: #DDF3E6;
  --bad: #B3322A;
  --bad-bg: #FFE3DD;
  --zone-down: #FFE3DD;
  --zone-up: #DDF3E6;
  --hl: #FFE88A;
  --band-s: 90%;
  --band-l: 88%;
  --dot-s: 72%;
  --dot-l: 50%;
  --txt-s: 70%;
  --txt-l: 38%;
  --font-display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1730;
    --surface: #18233F;
    --surface-2: #22304F;
    --fg: #EAF0FF;
    --muted: #A3B1D6;
    --line: #34456C;
    --accent: #7FA6FF;
    --accent-fg: #0F1730;
    --good: #4CD08C;
    --good-bg: #1F4636;
    --bad: #FF8B80;
    --bad-bg: #4A2A30;
    --zone-down: #4A2A30;
    --zone-up: #1F4636;
    --hl: #5A4B12;
    --band-s: 35%;
    --band-l: 26%;
    --dot-s: 75%;
    --dot-l: 62%;
    --txt-s: 80%;
    --txt-l: 72%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1730;
  --surface: #18233F;
  --surface-2: #22304F;
  --fg: #EAF0FF;
  --muted: #A3B1D6;
  --line: #34456C;
  --accent: #7FA6FF;
  --accent-fg: #0F1730;
  --good: #4CD08C;
  --good-bg: #1F4636;
  --bad: #FF8B80;
  --bad-bg: #4A2A30;
  --zone-down: #4A2A30;
  --zone-up: #1F4636;
  --hl: #5A4B12;
  --band-s: 35%;
  --band-l: 26%;
  --dot-s: 75%;
  --dot-l: 62%;
  --txt-s: 80%;
  --txt-l: 72%;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  padding-block: 16px 110px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body.large { font-size: 19px; }
.wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.wrap > * { min-width: 0; max-width: 100%; }
#view { display: flex; flex-direction: column; gap: 20px; min-width: 0; width: 100%; }
#view > * { min-width: 0; max-width: 100%; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: 2.1rem; font-weight: 700; }
h2 { font-size: 1.45rem; font-weight: 600; }
h3 { font-size: 1.1rem; font-weight: 600; }
p { margin: 0; }
b, strong { font-weight: 800; }
.eyebrow { font-size: .76rem; letter-spacing: .09em; text-transform: uppercase; font-weight: 800; color: var(--muted); }
.lead { color: var(--muted); max-width: 62ch; }
.hide { display: none !important; }

button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 12px; padding: 10px 18px; font-weight: 800; min-height: 46px; }
.btn.ghost { background: var(--surface-2); color: var(--fg); }
.btn:disabled { opacity: .45; cursor: default; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }

/* spoken sentences light up while they are read */
.say { border-radius: 6px; transition: background .15s; }
.say.on { background: var(--hl); box-shadow: 0 0 0 3px var(--hl); }

/* Top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; display: flex; align-items: center; gap: 10px; }
.brand { text-decoration: none; color: var(--fg); } .brand .st { color: #2b5fd9; }
.mark { min-width: 34px; height: 28px; padding: 0 8px; border-radius: 999px; background: #ffd166; color: #14213d; display: grid; place-items: center; font-size: .85rem; }
.tb { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: .9rem; min-height: 40px; }
.tb[aria-pressed="true"] { border-color: var(--accent); }
.level-switch { display: flex; align-items: center; gap: 3px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.level-switch-label { padding: 0 5px; font-size: .78rem; font-weight: 800; color: var(--muted); }
.level-pill { min-height: 34px; padding: 5px 10px; border: 0; border-radius: 999px; background: transparent; color: var(--fg); font-weight: 800; font-size: .83rem; }
.level-pill:hover, .level-pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.level-pill[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
@media (max-width: 560px) { .top { gap: 8px; } .level-switch { order: 3; width: fit-content; } .level-pill { padding-inline: 9px; } }

/* Settings */
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.settings label { display: flex; flex-direction: column; gap: 4px; font-weight: 800; font-size: .9rem; }
.settings select { font: inherit; min-height: 44px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); color: var(--fg); padding: 4px 8px; }
.settings .cb { flex-direction: row; align-items: center; gap: 10px; min-height: 44px; }
.settings .cb input { width: 22px; height: 22px; accent-color: var(--accent); }

/* Home */
.hero { display: flex; flex-direction: column; gap: 12px; }
.pillars { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.pillars .card { display: flex; flex-direction: column; gap: 4px; }
.topics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.topic { display: flex; flex-direction: column; gap: 8px; min-height: 150px; }
.topic.soon { opacity: .65; }
.tn { font-family: var(--font-display); font-weight: 700; color: var(--accent); font-size: 1.1rem; }
.bar { height: 10px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--good); border-radius: 6px; }
.tag { align-self: flex-start; font-size: .75rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
details.card summary { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; cursor: pointer; }
details.card[open] summary { margin-bottom: 10px; }
table.plan { border-collapse: collapse; width: 100%; font-size: .95rem; }
table.plan th, table.plan td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tscroll { overflow-x: auto; }

/* Lesson */
.partgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin: 14px 0; }
.partcard { display: flex; flex-direction: column; gap: 6px; }
.partico { font-size: 2.2rem; }
.partbar { display: flex; align-items: center; gap: 12px; margin: 8px 0; }
.stepgroups { display: grid; gap: 8px; margin: 8px 0 4px; }
.sgrow { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 16px; border: 2px solid transparent; background: var(--surface-2); }
.sgrow.on { border-color: var(--accent); }
.sglab { flex: none; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; min-width: 7.2em; }
.sgrow .stepper { padding-bottom: 0; }
@media (max-width: 560px) { .sgrow { flex-direction: column; align-items: flex-start; gap: 4px; } .sgrow .stepper { max-width: 100%; } }
.stepper { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.sp { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; background: var(--surface-2); border: 2px solid transparent; font-weight: 800; font-size: .85rem; }
.sp .num { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); font-size: .8rem; }
.sp.cur { background: var(--surface); border-color: var(--accent); }
.sp.done .num { background: var(--good); color: var(--accent-fg); }
.step-tag { font-size: .78rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.step-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.navrow { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* Slides */
.slide { display: flex; flex-direction: column; gap: 14px; }
.kindtag { align-self: flex-start; background: #e7efff; color: #1d3f9a; font-weight: 900; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; }
.live { background: var(--surface-2); border-radius: 14px; padding: 12px; }
.sdots { display: flex; gap: 6px; }
.sd { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); }
.sd.on { background: var(--accent); }
.visual { background: var(--surface-2); border-radius: 14px; padding: 12px; }
.visual svg { display: block; width: 100%; max-width: 560px; margin: 0 auto; height: auto; }
.sentences { display: flex; flex-direction: column; gap: 8px; font-size: 1.05rem; }
.caption { font-family: var(--font-display); font-size: 1.15rem; text-align: center; margin-top: 8px; }
.pv-cell { fill: var(--surface); stroke-width: 3; }
.pv-cell.hi { stroke-width: 5; }
.pv-cell.zero { stroke-dasharray: 6 5; }
.pv-d { fill: var(--fg); font-family: var(--font-display); font-weight: 700; font-size: 34px; text-anchor: middle; }
.pv-d.pad { fill: var(--muted); opacity: .6; }
.pv-n { fill: var(--fg); font-family: var(--font-body); font-weight: 800; font-size: 10px; text-anchor: middle; }
.pv-v { fill: var(--muted); font-family: var(--font-body); font-weight: 800; font-size: 11px; text-anchor: middle; }
.pv-arrow { stroke: var(--accent); stroke-width: 3; fill: none; stroke-linecap: round; }
.pv-head { fill: var(--accent); }
.pv-t { fill: var(--fg); font-family: var(--font-body); font-weight: 800; font-size: 12px; text-anchor: middle; }
.pv-b { fill: var(--fg); font-family: var(--font-display); font-weight: 700; font-size: 15px; }
.four { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.four > div { background: var(--surface); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.fn { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; }
.flow { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; }
.chip { background: var(--surface); border-radius: 12px; padding: 8px 14px; border: 2px solid var(--line); }
.chip.big { border-color: var(--accent); }
.worked { display: flex; flex-direction: column; gap: 12px; }
.wq { font-size: 1.15rem; font-weight: 800; }
.wnum { text-align: center; font-family: var(--font-display); font-weight: 700; font-size: clamp(2.2rem, 10vw, 3.4rem); }
.wnum .ul, .rnum .ul { text-decoration: underline; text-decoration-thickness: 4px; text-underline-offset: 6px; text-decoration-color: var(--accent); }
.wnum .dc, .rnum .dc { background: var(--bad-bg); border-radius: 8px; padding: 0 3px; }
.wsteps { margin: 0; padding-left: 1.3rem; display: flex; flex-direction: column; gap: 6px; min-height: 2em; }
.wres { text-align: center; font-family: var(--font-display); font-size: 1.4rem; font-weight: 600; color: var(--good); }

/* Number readout and columns */
.readout { text-align: center; padding: 6px 0 2px; }
.bignum { font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 9vw, 3.1rem); overflow-wrap: anywhere; }
.dg { color: hsl(var(--h) var(--txt-s) var(--txt-l)); }
.words { color: var(--muted); font-weight: 600; min-height: 3em; }
.groups { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 22px; margin-top: 10px; }
.group { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.group-label { font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.cols { display: flex; gap: 4px; }
.col { width: 56px; display: flex; flex-direction: column; align-items: stretch; gap: 4px; }
.chead { background: hsl(var(--h) var(--band-s) var(--band-l)); border-radius: 10px; padding: 5px 2px; text-align: center; min-height: 64px; display: flex; flex-direction: column; justify-content: space-between; gap: 2px; }
.cname { font-size: .66rem; line-height: 1.1; font-weight: 800; }
.cval { font-size: .72rem; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.stepbtn { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; min-height: 42px; font-size: 1.3rem; font-weight: 800; line-height: 1; }
.digit { background: var(--surface); border: 2px solid hsl(var(--h) var(--dot-s) var(--dot-l)); border-radius: 12px; min-height: 52px; font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; }
.col.sel .digit { background: hsl(var(--h) var(--band-s) var(--band-l)); }
.dots { display: grid; grid-template-columns: repeat(3, 12px); grid-auto-rows: 12px; gap: 3px; justify-content: center; align-content: start; min-height: 45px; padding-top: 2px; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: hsl(var(--h) var(--dot-s) var(--dot-l)); }
.explain { margin-top: 14px; background: var(--surface-2); border-radius: 12px; padding: 12px 14px; min-height: 3.2em; }
.note { margin-top: 8px; color: var(--muted); font-size: .92rem; min-height: 1.4em; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chal { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.chal li { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); font-weight: 700; }
.chal .tick { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex: none; font-size: .85rem; }
.chal li.ok .tick { background: var(--good); border-color: var(--good); color: var(--accent-fg); }

/* Rounding lab */
.modes { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.mode { background: var(--surface-2); border: 2px solid transparent; border-radius: 999px; padding: 8px 14px; font-weight: 800; min-height: 44px; }
.mode[aria-pressed="true"] { border-color: var(--accent); background: var(--surface); }
.rnum { text-align: center; font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 9vw, 3rem); margin: 4px 0 8px; }
.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; font-size: .88rem; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; }
.slider { width: 100%; accent-color: var(--accent); margin: 8px 0 4px; height: 32px; }
.nl-band-d { fill: var(--zone-down); }
.nl-band-u { fill: var(--zone-up); }
.nl-line { stroke: var(--fg); stroke-width: 3; fill: none; stroke-linecap: round; }
.nl-tick { stroke: var(--fg); stroke-width: 3; fill: none; }
.nl-mid { stroke: var(--muted); stroke-width: 2; stroke-dasharray: 4 4; fill: none; }
.nl-t { fill: var(--fg); font-family: var(--font-body); font-weight: 800; font-size: 13px; }
.nl-s { fill: var(--muted); font-family: var(--font-body); font-weight: 800; font-size: 11px; }
.nl-dot { fill: var(--accent); stroke: var(--surface-2); stroke-width: 3; }
.nl-conn { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 3 3; fill: none; }
.nl-arc { stroke: var(--accent); stroke-width: 4; fill: none; stroke-linecap: round; }
.nl-head { fill: var(--accent); }
.steps { margin: 6px 0 0; padding-left: 1.3rem; display: flex; flex-direction: column; gap: 4px; }
.answer { margin-top: 10px; font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; }
.pred { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }

/* Quiz */
.progress { display: flex; gap: 6px; margin-bottom: 12px; }
.pd { flex: 1; height: 8px; border-radius: 4px; background: var(--surface-2); }
.pd.cur { background: var(--accent); }
.pd.ok { background: var(--good); }
.pd.no { background: var(--bad); }
.qtag { font-size: .78rem; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.qtext { font-size: 1.15rem; font-weight: 600; margin: 6px 0 14px; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.opt { background: var(--surface-2); border: 2px solid transparent; border-radius: 12px; padding: 12px; font-weight: 800; min-height: 48px; text-align: left; }
.opt.ok { border-color: var(--good); background: var(--good-bg); }
.opt.no { border-color: var(--bad); background: var(--bad-bg); }
.ans { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ans input { font: inherit; font-size: 1.2rem; font-weight: 800; min-height: 48px; width: min(220px, 100%); padding: 6px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--fg); }
.fb { margin-top: 14px; padding: 12px 14px; border-radius: 12px; }
.fb.ok { background: var(--good-bg); }
.fb.no { background: var(--bad-bg); }
.fb.hint { background: var(--surface-2); }
.fb strong { display: block; margin-bottom: 2px; font-weight: 800; }
.qnext { margin-top: 12px; }
.shp { display: inline-block; width: 22px; height: 22px; vertical-align: -5px; margin: 0 1px; }
.shp.sq { background: hsl(350 var(--dot-s) var(--dot-l)); border-radius: 4px; }
.shp.tri { background: hsl(42 var(--dot-s) var(--dot-l)); clip-path: polygon(50% 4%, 96% 96%, 4% 96%); }
.shp.ci { background: hsl(195 var(--dot-s) var(--dot-l)); border-radius: 50%; }
.codeline { display: block; margin-top: 8px; font-size: 1.1rem; }
.score { text-align: center; padding: 8px 0; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.stars { font-size: 2rem; letter-spacing: .12em; color: hsl(42 var(--dot-s) var(--dot-l)); }
.big { font-family: var(--font-display); font-size: 2.2rem; font-weight: 700; }
.sumlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%; max-width: 420px; }
.sumlist li { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); font-weight: 700; }


/* Continuous reader dock: stays in view so reading can be switched on once for a whole session. */
.reader-dock { position: fixed; z-index: 35; right: 12px; top: 42%; width: 170px; padding: 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: 0 8px 28px rgba(20,35,70,.16); display: flex; flex-direction: column; gap: 7px; }
.reader-dock .dock-title { font-family: var(--font-display); font-weight: 700; font-size: 1rem; }
.reader-dock .dock-note { font-size: .76rem; line-height: 1.35; color: var(--muted); }
.reader-toggle { width: 100%; min-height: 44px; border: 0; border-radius: 10px; padding: 8px 10px; font: inherit; font-weight: 800; background: var(--surface-2); color: var(--fg); }
.reader-toggle[aria-pressed="true"] { background: var(--good-bg); border: 2px solid var(--good); }
.reader-dock.on .dock-title { color: var(--good); }
.level-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.level-option { min-height: 160px; text-align: left; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; border: 2px solid var(--line); border-radius: 16px; padding: 16px; background: var(--surface); color: var(--fg); }
.level-option:hover, .level-option:focus-visible { border-color: var(--accent); background: var(--surface-2); }
.level-option .level-name { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; }
.level-option .level-note { font-size: .9rem; color: var(--muted); line-height: 1.35; }
.level-option .level-mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; background: var(--surface-2); color: var(--accent); font-size: 1.2rem; font-weight: 900; }
