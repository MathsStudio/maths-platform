<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to MathsStudio</title><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css"></head><body class="plain">
<header class="nav"><a class="brand" href="/"><svg class="mark" width="40" height="40" viewBox="0 0 64 64" role="img" aria-label="MathsStudio logo"><rect width="64" height="64" rx="16" fill="#2b5fd9"/><path d="M16 47V21L32 39L48 21V47" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="15" r="4.5" fill="#ffd166"/></svg><span class="word"><span>Maths</span><span class="st">Studio</span></span></a><nav class="links"><a class="pill" href="/signup/">Sign up</a></nav></header>
<main class="narrow"><form class="card" id="login" novalidate>
<h1>Sign in</h1><p>Use your email and password.</p>
<label for="email">Your email address</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="name@example.com">
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button class="btn block" type="submit">Sign in</button>
<div class="msg" hidden role="status"></div>
<p class="note" style="margin-top:14px"><a href="/forgot/">Forgot your password?</a></p>
<p class="note">New here? <a href="/signup/">Sign up</a>.</p>
</form></main><script src="/site.js?v=4"></script></body></html>
